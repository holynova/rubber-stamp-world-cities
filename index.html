<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,viewport-fit=cover">
  <title>橡胶戳艺术印记 · 世界城市 / 十二生肖 / 二十四节气 / 山海神异</title>
  <meta name="description" content="30座世界城市、十二生肖、二十四节气与山海神异的复古手工橡胶戳印艺术画廊，支持声音盖章打卡、藏书票导出与多色系油墨切换。">

  <!-- Analytics -->
  <script
    defer
    src="https://cloud.umami.is/script.js"
    data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"
    data-domains="holynova.github.io,xiaosang.cc"
    data-exclude-search="true"
    data-exclude-hash="true"
  ></script>

  <style>
    :root {
      --paper: #eee5d5;
      --paper-card: #f8f1e5;
      --ink: #292722;
      --muted: #746d60;
      --line: #cfc2ad;
      --accent: #8d4d39;
      --tab-bg: #e6dac6;
      --card-bg: #ddd0bb;
      --seal-red: #b83b26;
      --seal-bg: #fff5eb;
    }
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-x: hidden;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif;
      background-image: radial-gradient(#7e6f5c18 .7px, transparent .7px);
      background-size: 7px 7px;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    /* Ink Palette Filters */
    .ink-cinnabar .stamp-img, .ink-cinnabar .modal-img-wrap img {
      filter: sepia(0.9) saturate(3.5) hue-rotate(-52deg) contrast(1.2);
    }
    .ink-charcoal .stamp-img, .ink-charcoal .modal-img-wrap img {
      filter: grayscale(1) contrast(1.25) brightness(0.95);
    }

    header {
      max-width: 1240px;
      width: 100%;
      margin: auto;
      padding: 42px 28px 20px;
      border-bottom: 1px solid var(--line);
    }
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
      min-width: 0;
    }
    .header-content {
      flex: 1;
      min-width: 0;
      width: 100%;
    }
    .kicker {
      font: 11.5px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--accent);
      transition: color .2s ease;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    h1 {
      font-size: clamp(26px, 4.8vw, 56px);
      line-height: 1.12;
      font-weight: 400;
      margin: 10px 0 12px;
      max-width: 800px;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    header p {
      max-width: 720px;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.65;
      margin: 0;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .header-actions {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .btn-top {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 8px 12px;
      color: var(--ink);
      text-decoration: none;
      font: 12.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .03em;
      transition: all .15s ease;
      box-shadow: 2px 2px 0 #c7b9a244;
      cursor: pointer;
      white-space: nowrap;
      min-height: 38px;
    }
    .btn-top:hover {
      background: #ede3d0;
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 3px 3px 0 #c7b9a288;
    }
    .btn-top:active {
      transform: translateY(1px);
      box-shadow: 1px 1px 0 #c7b9a244;
    }
    .btn-top-accent {
      background: #ede0cb;
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .passport-badge {
      background: var(--seal-red);
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 2px;
      line-height: 1;
    }

    /* Series Segmented Navigation */
    .series-nav-wrapper {
      max-width: 1240px;
      width: 100%;
      margin: auto;
      padding: 14px 28px 0;
      min-width: 0;
    }
    .series-nav {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      min-width: 0;
    }
    .series-nav::-webkit-scrollbar { display: none; }
    .series-tab {
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-family: inherit;
      transition: all .15s ease;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 38px;
      box-shadow: 1.5px 1.5px 0 #c7b9a233;
    }
    .series-tab:hover {
      color: var(--ink);
      background: #fff8ee;
      border-color: #bfae95;
    }
    .series-tab:active {
      transform: translateY(1px);
    }
    .series-tab.active {
      background: #ede0cb;
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
      box-shadow: inset 1px 1px 0 #8d4d3922, 1.5px 1.5px 0 #8d4d3933;
    }
    .tab-badge {
      font: 11px ui-monospace, monospace;
      padding: 2px 5px;
      background: #ddd1bd;
      border-radius: 2px;
      color: var(--ink);
      line-height: 1;
    }
    .series-tab.active .tab-badge {
      background: var(--accent);
      color: #fff;
    }
    .tab-title { font-size: 14.5px; }
    .tab-sub {
      font: 10.5px ui-monospace, monospace;
      opacity: .75;
      text-transform: uppercase;
    }

    /* Toolbar & Interactive Controls */
    .toolbar {
      max-width: 1240px;
      width: 100%;
      margin: auto;
      padding: 14px 28px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }
    .toolbar-search-row {
      display: flex;
      gap: 8px;
      flex: 1 1 300px;
      align-items: center;
      min-width: 0;
      width: 100%;
    }
    input, select {
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 8px 11px;
      color: var(--ink);
      font: 13px ui-monospace, monospace;
      outline: none;
      transition: border-color .15s ease;
      height: 36px;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    input {
      flex: 1;
      min-width: 110px;
    }
    select {
      flex-shrink: 0;
      cursor: pointer;
    }
    .ink-selector-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font: 12px ui-monospace, monospace;
      color: var(--muted);
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 2px 0;
      min-width: 0;
    }
    .ink-selector-wrap::-webkit-scrollbar { display: none; }
    .ink-label {
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ink-pill-group {
      display: flex;
      gap: 4px;
      background: #ede3d0;
      padding: 3px;
      border-radius: 4px;
      border: 1px solid var(--line);
      flex-shrink: 0;
    }
    .ink-pill {
      border: 0;
      background: transparent;
      padding: 4px 8px;
      border-radius: 3px;
      font: 11px ui-monospace, monospace;
      cursor: pointer;
      color: var(--muted);
      transition: all .15s ease;
      white-space: nowrap;
      min-height: 26px;
    }
    .ink-pill:hover { color: var(--ink); background: #fdfaf4; }
    .ink-pill.active {
      background: #f7f0e4;
      color: var(--ink);
      font-weight: 600;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    .count {
      margin-left: auto;
      color: var(--muted);
      font: 12px ui-monospace, monospace;
      white-space: nowrap;
    }

    /* Grid & Cards */
    .grid {
      max-width: 1240px;
      margin: auto;
      padding: 26px 28px 70px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 22px;
    }
    .card {
      position: relative;
      background: #f7f0e444;
      border-radius: 4px;
      transition: transform .18s ease;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .card:hover {
      transform: translateY(-3px);
    }
    .frame {
      position: relative;
      aspect-ratio: 4/5;
      background: var(--card-bg);
      border: 1px solid #c7b9a2;
      box-shadow: 3px 4px 0 #c7b9a244;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow .18s ease;
    }
    .card:hover .frame {
      box-shadow: 4px 6px 0 #c7b9a277;
    }
    .stamp-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform .25s ease, filter .2s ease;
    }
    .card:hover .stamp-img {
      transform: scale(1.02);
    }
    .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #eee5d5ee;
      border: 1px solid var(--line);
      padding: 2px 5px;
      font: 10px ui-monospace, monospace;
      letter-spacing: .03em;
      z-index: 2;
      border-radius: 2px;
    }
    
    /* Stamp Overlays */
    .stamped-seal {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px dashed var(--seal-red);
      color: var(--seal-red);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font: 8.5px/1.1 ui-monospace, monospace;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
      background: rgba(255, 246, 238, 0.92);
      box-shadow: inset 0 0 0 1px rgba(184, 59, 38, 0.25), 2px 2px 4px rgba(0,0,0,0.12);
      transform: rotate(-10deg);
      pointer-events: none;
      z-index: 3;
      animation: stampPop 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes stampPop {
      0% { transform: scale(2.4) rotate(18deg); opacity: 0; }
      70% { transform: scale(0.9) rotate(-12deg); opacity: 1; }
      100% { transform: scale(1) rotate(-10deg); opacity: 1; }
    }
    .seal-inner-char {
      font-size: 14px;
      font-family: "Songti SC", "Noto Serif CJK SC", serif;
      line-height: 1;
      margin-bottom: 2px;
    }

    .card-info {
      padding: 8px 2px 2px;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }
    .card h2 {
      font-size: 17px;
      font-weight: 500;
      margin: 0 0 3px;
      line-height: 1.25;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card h2:hover { color: var(--accent); }
    .meta {
      font: 11px/1.45 ui-monospace, monospace;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .keywords {
      color: var(--accent);
      font-size: 11.5px;
      line-height: 1.35;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    /* Card bottom action bar */
    .card-actions {
      display: flex;
      gap: 5px;
      margin-top: auto;
      padding-top: 5px;
      border-top: 1px dashed var(--line);
    }
    .btn-card-action {
      flex: 1;
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 5px 4px;
      font: 11px ui-monospace, monospace;
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all .15s ease;
      white-space: nowrap;
      min-height: 30px;
      min-width: 0;
    }
    .btn-card-action:hover {
      background: #ede0cb;
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-card-action:active {
      transform: scale(0.97);
    }
    .btn-card-stamp.stamped {
      background: #fbeee8;
      border-color: var(--seal-red);
      color: var(--seal-red);
      font-weight: 600;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 15px;
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      background: #211f1bdd;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
      backdrop-filter: blur(4px);
    }
    .lightbox.open { display: flex; }
    .modal {
      max-width: 940px;
      width: 100%;
      max-height: 92vh;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(260px, .8fr);
      background: var(--paper);
      padding: 18px;
      gap: 20px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 40px rgba(0,0,0,.35);
      position: relative;
      border-radius: 4px;
    }
    .modal-img-wrap {
      position: relative;
      background: var(--card-bg);
      border: 1px solid #c7b9a2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 2px;
    }
    .modal img {
      width: 100%;
      height: 100%;
      max-height: 82vh;
      object-fit: contain;
      display: block;
      transition: filter .2s ease;
    }
    .modal aside {
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .modal-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .modal h2 {
      font-size: 28px;
      font-weight: 400;
      margin: 0 0 10px;
      line-height: 1.15;
    }
    .close {
      border: 0;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
      padding: 0 6px;
      min-width: 36px;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .close:hover { color: var(--accent); background: rgba(0,0,0,0.04); }
    .modal-meta {
      font: 12px/1.55 ui-monospace, monospace;
      color: var(--muted);
      margin-bottom: 10px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }
    .modal-keywords {
      color: var(--accent);
      font-size: 13.5px;
      margin-bottom: 8px;
    }
    .modal-colors {
      font: 11px ui-monospace, monospace;
      color: var(--muted);
      margin-bottom: 12px;
    }
    
    .modal-interactive-btns {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .btn-modal-action {
      flex: 1;
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 9px 10px;
      font: 12.5px ui-monospace, monospace;
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all .15s ease;
      min-height: 38px;
    }
    .btn-modal-action:hover {
      background: #ede0cb;
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-modal-stamp.stamped {
      background: #fbeee8;
      border-color: var(--seal-red);
      color: var(--seal-red);
      font-weight: 600;
    }
    .btn-modal-exlibris {
      background: #e8ede3;
      border-color: #8fa389;
      color: #3b5a3f;
    }
    .btn-modal-exlibris:hover {
      background: #dbe4d5;
      border-color: #3b5a3f;
      color: #2b452f;
    }

    .modal-nav-btns {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .modal-btn {
      flex: 1;
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 7px 10px;
      font: 12px ui-monospace, monospace;
      cursor: pointer;
      color: var(--ink);
      text-align: center;
      min-height: 34px;
    }
    .modal-btn:hover {
      background: #eee0cc;
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Modal 2: Stamp Passport Modal */
    .passport-modal-inner {
      max-width: 980px;
      width: 100%;
      max-height: 92vh;
      background: var(--paper);
      padding: 22px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 40px rgba(0,0,0,.35);
      display: flex;
      flex-direction: column;
      position: relative;
      border-radius: 4px;
    }
    .passport-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }
    .passport-title {
      font-size: 26px;
      font-weight: 400;
      margin: 0 0 4px;
    }
    .passport-stats {
      font: 12.5px ui-monospace, monospace;
      color: var(--muted);
    }
    .passport-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .passport-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      overflow-y: auto;
      max-height: 52vh;
      padding: 8px;
      background: #fdfaf4;
      border: 1px solid var(--line);
      border-radius: 3px;
    }
    .passport-item {
      position: relative;
      aspect-ratio: 4/5;
      background: var(--card-bg);
      border: 1px solid #c7b9a2;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 2px 3px 0 #c7b9a244;
      cursor: pointer;
      transition: transform .15s ease;
    }
    .passport-item:hover { transform: scale(1.03); }
    .passport-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .passport-item-title {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(247, 240, 228, 0.92);
      font: 10px/1.2 ui-monospace, monospace;
      text-align: center;
      padding: 3px 2px;
      border-top: 1px solid var(--line);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal 3: Ex-Libris Generator Modal */
    .exlibris-modal-inner {
      max-width: 960px;
      width: 100%;
      max-height: 94vh;
      background: var(--paper);
      padding: 22px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 40px rgba(0,0,0,.35);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      position: relative;
      overflow-y: auto;
      border-radius: 4px;
    }
    .exlibris-preview-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #312e2b;
      padding: 14px;
      border-radius: 4px;
      border: 1px solid #4a4540;
    }
    #exlibris-canvas {
      max-width: 100%;
      max-height: 62vh;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      background: #f4ecdc;
    }
    .exlibris-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label {
      font: 11.5px ui-monospace, monospace;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-top-puzzle {
      background: #f5eedd;
      border-color: #8d4d39;
      color: #8d4d39;
      font-weight: 600;
    }
    .btn-top-puzzle:hover {
      background: #ebdcc7;
      border-color: #b83b26;
      color: #b83b26;
    }

    /* Floating Toast Notification */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-24px);
      background: rgba(41, 39, 34, 0.94);
      color: #fffaf2;
      padding: 10px 20px;
      border-radius: 24px;
      font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      opacity: 0;
      transition: all .25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 99999;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Modal 4: Stamp Journal & Collage Book Modal */
    .journal-modal-inner {
      max-width: 1240px;
      width: 96vw;
      max-height: 94vh;
      background: var(--paper);
      padding: 22px;
      border: 1px solid var(--line);
      box-shadow: 0 24px 50px rgba(0,0,0,.45);
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: 20px;
      position: relative;
      overflow-y: auto;
      border-radius: 6px;
    }
    #journal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 30;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: rgba(0,0,0,0.06);
      border-radius: 50%;
    }
    #journal-close:hover {
      background: rgba(0,0,0,0.12);
      color: var(--accent);
    }
    .journal-preview-pane {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #2b2724;
      padding: 16px;
      border-radius: 6px;
      border: 1px solid #453f3a;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
    }
    .journal-toolbar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #453f3a;
    }
    .journal-toolbar-title {
      font: bold 12.5px ui-monospace, monospace;
      color: #ebdcc7;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .journal-quick-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-journal-tool {
      background: #3d3732;
      border: 1px solid #5a524a;
      color: #e6dac3;
      padding: 5px 9px;
      border-radius: 3px;
      font: 11.5px ui-monospace, monospace;
      cursor: pointer;
      transition: all .15s ease;
    }
    .btn-journal-tool:hover {
      background: #504842;
      color: #fff;
      border-color: #8d4d39;
    }
    .journal-canvas-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 320px;
      padding: 8px;
      background: #211e1b;
      border-radius: 4px;
      overflow: hidden;
    }
    #journal-canvas {
      max-width: 100%;
      height: auto;
      aspect-ratio: 3/2;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      border-radius: 4px;
      background: #f4ecdc;
      display: block;
      cursor: pointer;
    }
    .journal-export-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 4px;
    }
    .btn-journal-export {
      flex: 2;
      padding: 12px 14px;
      font-size: 13.5px;
      font-weight: 600;
      justify-content: center;
    }
    .btn-journal-print {
      flex: 1;
      padding: 12px 10px;
      font-size: 12.5px;
      justify-content: center;
    }

    /* Right: Sidebar & Picker */
    .journal-sidebar-pane {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .journal-sidebar-header h2 {
      font-size: 21px;
      color: var(--ink);
      margin: 0 0 4px 0;
      font-family: "Songti SC", Georgia, serif;
    }
    .journal-sidebar-header p {
      font: 12px/1.4 ui-monospace, monospace;
      color: var(--muted);
      margin: 0;
    }
    .journal-config-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fdfaf4;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    .stamp-picker-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-height: 220px;
      background: #fdfaf4;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    .stamp-picker-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stamp-picker-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font: 12px ui-monospace, monospace;
      color: var(--ink);
      font-weight: 600;
    }
    .stamp-slot-counter {
      color: var(--accent);
      background: #f4ecdc;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
    }
    .picker-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 0;
    }
    .picker-tabs::-webkit-scrollbar { display: none; }
    .picker-tab {
      background: #f0e6d6;
      border: 1px solid var(--line);
      color: var(--ink);
      font: 11px ui-monospace, monospace;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s ease;
    }
    .picker-tab.active {
      background: var(--ink);
      color: #fffaf2;
      border-color: var(--ink);
    }
    .stamp-picker-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding: 6px;
      background: #f5eedd;
      border: 1px solid var(--line);
      border-radius: 3px;
    }
    .picker-stamp-item {
      position: relative;
      height: 110px;
      background: var(--card-bg);
      border: 1.5px solid #c7b9a2;
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
      transition: all .15s ease;
      box-shadow: 1px 2px 0 #c7b9a244;
      display: block;
    }
    .picker-stamp-item:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
    .picker-stamp-item.in-journal {
      border-color: #2b7a4b;
      box-shadow: 0 0 0 2px #2b7a4b;
    }
    .picker-stamp-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .picker-stamp-item-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(247, 240, 228, 0.95);
      font: 10px/1.2 ui-monospace, monospace;
      text-align: center;
      padding: 3px 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid var(--line);
      z-index: 2;
    }
    .picker-stamp-item-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      background: #2b7a4b;
      color: #fff;
      font-size: 8px;
      padding: 1px 4px;
      border-radius: 8px;
      font-weight: bold;
      z-index: 3;
    }
    .journal-checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--ink);
      user-select: none;
      margin: 2px 0;
    }
    .journal-checkbox-wrap input {
      width: 16px !important;
      height: 16px !important;
      min-width: 16px !important;
      flex: 0 0 16px !important;
      margin: 0 !important;
      cursor: pointer;
      accent-color: #b83b26;
    }

    /* Mobile Responsive Breakpoints */
    @media(max-width: 768px) {
      header { padding: 24px 16px 14px; }
      .header-inner {
        flex-direction: column-reverse;
        gap: 12px;
      }
      .header-actions {
        width: 100%;
        justify-content: flex-start;
        gap: 8px;
      }
      .header-actions .btn-top {
        flex: 1;
      }
      .series-nav-wrapper {
        padding: 10px 16px 0;
      }
      .toolbar {
        padding: 10px 16px;
        gap: 8px;
      }
      .toolbar-search-row {
        width: 100%;
        flex: 1 1 100%;
      }
      .ink-selector-wrap {
        width: 100%;
        justify-content: flex-start;
      }
      .count {
        font-size: 11px;
      }
      .grid {
        padding: 14px 16px 60px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .card h2 { font-size: 15px; }
      .meta { -webkit-line-clamp: 1; font-size: 10.5px; }
      .keywords { font-size: 10.5px; margin-bottom: 6px; }
      .btn-card-action { font-size: 10px; padding: 4px 2px; }
      .stamped-seal {
        width: 40px;
        height: 40px;
        right: 6px;
        bottom: 6px;
        font-size: 7.5px;
      }
      .seal-inner-char { font-size: 13px; }

      /* Lightbox */
      .lightbox { padding: 10px; }
      .modal {
        grid-template-columns: 1fr;
        max-height: 92vh;
        overflow-y: auto;
        gap: 12px;
        padding: 14px;
        border-radius: 6px;
      }
      .modal-img-wrap {
        max-height: 44vh;
        aspect-ratio: 4/5;
        margin: 0 auto;
      }
      .modal img { max-height: 44vh; }
      .modal aside { padding: 4px 0 0; }
      .modal h2 { font-size: 22px; margin-bottom: 8px; }
      .modal-meta { font-size: 11px; padding-bottom: 8px; margin-bottom: 8px; }
      .modal-keywords { font-size: 12px; margin-bottom: 8px; }
      .modal-colors { font-size: 10.5px; margin-bottom: 10px; }
      .modal-interactive-btns {
        padding-top: 10px;
        gap: 8px;
      }
      .btn-modal-action {
        padding: 9px 8px;
        font-size: 12px;
        min-height: 40px;
      }
      .modal-nav-btns {
        margin-top: 10px;
        gap: 8px;
      }
      .modal-btn {
        flex: 1;
        padding: 8px;
        text-align: center;
        min-height: 38px;
      }
      .close {
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        background: rgba(0,0,0,0.05);
        border-radius: 50%;
      }

      /* Passport Modal */
      .passport-modal-inner {
        padding: 16px 12px;
        max-height: 90vh;
        border-radius: 6px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }
      .passport-header {
        align-items: center;
      }
      .passport-title { font-size: 19px; }
      .passport-toolbar { gap: 6px; width: 100%; }
      .passport-toolbar button {
        font-size: 12px;
        padding: 7px 10px;
        min-height: 36px;
      }
      #btn-export-postcard {
        width: 100%;
        order: -1;
      }
      .passport-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        max-height: 48vh;
        padding: 6px;
        width: 100%;
        min-width: 0;
      }
      .passport-item {
        width: 100%;
        min-width: 0;
      }
      .passport-item-title { font-size: 9.5px; padding: 2px 1px; }

      /* Ex-Libris Modal */
      .exlibris-modal-inner {
        grid-template-columns: 1fr;
        padding: 14px 12px;
        max-height: 92vh;
        gap: 12px;
        border-radius: 6px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }
      .exlibris-preview-wrap {
        padding: 8px;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #262320;
      }
      #exlibris-canvas {
        max-height: 28vh;
        max-width: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        display: block;
        margin: 0 auto;
      }

      /* Journal Modal Mobile */
      .journal-modal-inner {
        grid-template-columns: 1fr;
        padding: 14px 10px;
        max-height: 92vh;
        gap: 12px;
        border-radius: 6px;
        width: 100%;
        max-width: 100%;
      }
      .journal-preview-pane {
        padding: 10px;
      }
      .journal-canvas-container {
        min-height: auto;
        padding: 4px;
      }
      #journal-canvas {
        max-height: 30vh;
        width: 100%;
      }
      .journal-export-bar {
        flex-direction: column;
      }
      .btn-journal-export, .btn-journal-print {
        width: 100%;
        min-height: 42px;
      }
      .stamp-picker-grid {
        grid-template-columns: repeat(4, 1fr);
        max-height: 160px;
      }
      .journal-config-form input, .journal-config-form select {
        font-size: 16px; /* iOS Safari zoom prevention */
        height: 40px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .exlibris-form input, .exlibris-form select {
        font-size: 16px; /* iOS Safari auto-zoom prevention */
        height: 40px;
        width: 100%;
      }
      #btn-download-exlibris {
        min-height: 44px;
        font-size: 13.5px;
      }
    }

    @media(max-width: 360px) {
      .grid { gap: 8px; padding-left: 10px; padding-right: 10px; }
      .card-actions { flex-direction: column; }
      .passport-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-content">
        <div class="kicker" id="hero-kicker">field notes / rubber stamp travel posters / 2026</div>
        <h1 id="hero-title">橡胶戳旅行实地笔记<br>世界城市</h1>
        <p id="hero-desc">30 座城市，30 枚低调的多色橡胶戳。每一张只留下一个地点最易辨认的轮廓：建筑、山脉、海岸线与城市的呼吸。</p>
      </div>
      <div class="header-actions">
        <button class="btn-top btn-top-puzzle" id="btn-open-journal">
          <span>手账拼贴</span>
          <span class="passport-badge" id="journal-count-badge">0</span>
        </button>
        <button class="btn-top btn-top-accent" id="btn-open-passport">
          <span>印记收集册</span>
          <span class="passport-badge" id="passport-count-badge">0</span>
        </button>
        <a href="https://github.com/holynova/rubber-stamp-world-cities" target="_blank" rel="noopener noreferrer" class="btn-top" title="GitHub 源码仓库">
          <svg style="width:15px;height:15px;fill:currentColor" viewBox="0 0 24 24">

          </svg>
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Collection Switcher Tabs -->
  <div class="series-nav-wrapper">
    <nav class="series-nav" id="series-nav">
      <button class="series-tab active" data-series="cities">
        <span class="tab-badge">30</span>
        <span class="tab-title">世界城市</span>
        <span class="tab-sub">Cities</span>
      </button>
      <button class="series-tab" data-series="scenic_spots">
        <span class="tab-badge">50</span>
        <span class="tab-title">名胜风景</span>
        <span class="tab-sub">5A Scenic</span>
      </button>
      <button class="series-tab" data-series="zodiac">
        <span class="tab-badge">12</span>
        <span class="tab-title">十二生肖</span>
        <span class="tab-sub">Zodiac</span>
      </button>
      <button class="series-tab" data-series="solar_terms">
        <span class="tab-badge">24</span>
        <span class="tab-title">二十四节气</span>
        <span class="tab-sub">Solar Terms</span>
      </button>
      <button class="series-tab" data-series="shanhaijing">
        <span class="tab-badge">10</span>
        <span class="tab-title">山海神异</span>
        <span class="tab-sub">Shan Hai Jing</span>
      </button>
    </nav>
  </div>

  <div class="toolbar">
    <div class="toolbar-search-row">
      <input id="search" placeholder="搜索名称、特征或关键词…">
      <select id="filter">
        <!-- Populated dynamically -->
      </select>
    </div>

    <!-- Ink Palette Switcher -->
    <div class="ink-selector-wrap">
      <span class="ink-label">配色:</span>
      <div class="ink-pill-group">
        <button class="ink-pill active" data-ink="original" title="原版天然配色">原色</button>
        <button class="ink-pill" data-ink="charcoal" title="黑白木刻版画">黑白</button>
        <button class="ink-pill" data-ink="cinnabar" title="朱砂红白印泥">红白</button>
      </div>
    </div>

    <span class="count" id="count"></span>
  </div>

  <main class="grid" id="grid"></main>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox">
    <div class="modal">
      <div class="modal-img-wrap">
        <img id="big" alt="">
      </div>
      <aside>
        <div class="modal-top-bar">
          <div class="kicker" id="number"></div>
          <button class="close" id="close" title="关闭 (Esc)">×</button>
        </div>
        <h2 id="title"></h2>
        <div class="modal-meta" id="details"></div>
        <div class="modal-keywords" id="desc"></div>
        <div class="modal-colors" id="colors-info"></div>
        
        <div class="modal-interactive-btns">
          <button class="btn-modal-action btn-modal-stamp" id="modal-stamp-btn">
            <span>盖入收集册</span>
          </button>
          <button class="btn-modal-action" id="modal-journal-btn" style="background:#ede0cb;border-color:var(--accent);color:var(--accent);">
            <span>贴入手账本</span>
          </button>
          <button class="btn-modal-action btn-modal-exlibris" id="modal-exlibris-btn">
            <span>制作藏书票</span>
          </button>
        </div>

        <div class="modal-nav-btns">
          <button class="modal-btn" id="btn-prev">← 上一张</button>
          <button class="modal-btn" id="btn-next">下一张 →</button>
        </div>
      </aside>
    </div>
  </div>

  <!-- Stamp Passport Modal -->
  <div class="lightbox" id="passport-lightbox">
    <div class="passport-modal-inner">
      <div class="passport-header">
        <div>
          <h2 class="passport-title">印记收集册 · Stamp Passport</h2>
          <div class="passport-stats" id="passport-stats-text">已收集 0 枚印章</div>
        </div>
        <button class="close" id="passport-close" title="关闭 (Esc)">×</button>
      </div>
      <div class="passport-toolbar">
        <button class="btn-top btn-top-accent" id="btn-export-postcard">导出明信片</button>
        <button class="btn-top" id="btn-passport-to-journal">排入手账本</button>
        <button class="btn-top" id="btn-stamp-all">全套盖印</button>
        <button class="btn-top" id="btn-reset-passport" style="color:#b83b26;">清空记录</button>
      </div>
      <div class="passport-grid" id="passport-grid">
        <!-- Filled dynamically -->
      </div>
    </div>
  </div>

  <!-- Stamp Journal & Collage Book Modal (手账拼图本) -->
  <div class="lightbox" id="journal-lightbox">
    <div class="journal-modal-inner">
      <button class="close" id="journal-close" title="关闭 (Esc)">×</button>

      <!-- Left: Interactive Journal Preview Pane -->
      <div class="journal-preview-pane">
        <div class="journal-toolbar-top">
          <span class="journal-toolbar-title">手账跨页预览</span>
          <div class="journal-quick-actions">
            <button class="btn-journal-tool" id="btn-fill-collected" title="将已收集的作品自动排版入本">
              填入已收集
            </button>
            <button class="btn-journal-tool" id="btn-random-journal" title="从全部 76 款印章中随机挑选">
              随机排版
            </button>
            <button class="btn-journal-tool" id="btn-clear-journal" title="清空当前手账页中的印章">
              清空本页
            </button>
          </div>
        </div>

        <div class="journal-canvas-container" id="journal-container">
          <canvas id="journal-canvas" width="1200" height="800"></canvas>
        </div>

        <div class="journal-export-bar">
          <button class="btn-top btn-top-accent btn-journal-export" id="btn-download-journal">

  <script src="data.js"></script>
  <script>
    /* -------------------------------------------------------------
       1. Web Audio API Tactile Stamp Press Synthesizer
       ------------------------------------------------------------- */
    let audioCtx = null;
    function playStampSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        const t = audioCtx.currentTime;

        // 1. Low Thump (Rubber cushion hitting thick deckle paper)
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(32, t + 0.075);
        oscGain.gain.setValueAtTime(0.75, t);
        oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.08);

        // 2. High Mechanical Click (Handle pressure transient)
        const clickOsc = audioCtx.createOscillator();
        const clickGain = audioCtx.createGain();
        clickOsc.type = "triangle";
        clickOsc.frequency.setValueAtTime(880, t);
        clickOsc.frequency.exponentialRampToValueAtTime(90, t + 0.02);
        clickGain.gain.setValueAtTime(0.4, t);
        clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
        clickOsc.connect(clickGain);
        clickGain.connect(audioCtx.destination);
        clickOsc.start(t);
        clickOsc.stop(t + 0.02);

        // 3. Tactile Paper Friction Burst
        const bufferSize = Math.floor(audioCtx.sampleRate * 0.04);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(550, t);
        filter.Q.setValueAtTime(1.5, t);
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.3, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start(t);
        noise.stop(t + 0.035);
      } catch (err) {
        console.warn("Audio unavailable", err);
      }
    }

    function initMobileAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      } catch (e) {}
    }
    window.addEventListener("touchstart", initMobileAudio, { once: true, passive: true });
    window.addEventListener("pointerdown", initMobileAudio, { once: true, passive: true });

    /* -------------------------------------------------------------
       2. State & Storage Management
       ------------------------------------------------------------- */
    const STORAGE_KEY = "rubber_stamp_passport_v2";
    let collectedMap = {};
    try {
      collectedMap = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    } catch (e) {
      collectedMap = {};
    }

    function saveCollected() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(collectedMap));
      } catch (e) {}
      updatePassportBadge();
    }

    function isStamped(seriesKey, id) {
      return !!collectedMap[`${seriesKey}_${id}`];
    }

    function toggleStamp(seriesKey, id) {
      const key = `${seriesKey}_${id}`;
      if (collectedMap[key]) {
        delete collectedMap[key];
      } else {
        collectedMap[key] = {
          time: new Date().toISOString(),
          dateStr: new Date().toLocaleDateString("zh-CN")
        };
        playStampSound();
      }
      saveCollected();
      render();
      if (document.querySelector("#lightbox").classList.contains("open")) {
        updateModalStampBtn();
      }
    }

    function getTotalCollectedCount() {
      return Object.keys(collectedMap).length;
    }

    function updatePassportBadge() {
      const count = getTotalCollectedCount();
      document.querySelector("#passport-count-badge").textContent = count;
    }

    /* -------------------------------------------------------------
       3. Ink Palette Management
       ------------------------------------------------------------- */
    let currentInk = "original";
    const inkPills = document.querySelectorAll(".ink-pill");
    inkPills.forEach(pill => {
      pill.addEventListener("click", () => {
        setInkPalette(pill.dataset.ink);
      });
    });

    function setInkPalette(inkName) {
      currentInk = inkName;
      inkPills.forEach(p => p.classList.toggle("active", p.dataset.ink === inkName));
      document.body.className = inkName === "original" ? "" : `ink-${inkName}`;
    }

    /* -------------------------------------------------------------
       4. Gallery Navigation & Rendering
       ------------------------------------------------------------- */
    let currentSeriesKey = "cities";
    let currentModalIndex = 0;
    let currentFilteredRows = [];

    const grid = document.querySelector("#grid");
    const search = document.querySelector("#search");
    const filter = document.querySelector("#filter");
    const count = document.querySelector("#count");
    const heroKicker = document.querySelector("#hero-kicker");
    const heroTitle = document.querySelector("#hero-title");
    const heroDesc = document.querySelector("#hero-desc");
    const tabs = document.querySelectorAll(".series-tab");

    function getCollection() {
      return window.COLLECTIONS[currentSeriesKey] || window.COLLECTIONS.cities;
    }

    function initFilterOptions() {
      if (currentSeriesKey === "scenic_spots") {
        filter.style.display = "";
        filter.innerHTML = `
          <option value="all">全部名胜风景 (50)</option>
          <option value="region-华北">华北名胜 (9)</option>
          <option value="region-华东">华东名胜 (11)</option>
          <option value="region-西南">西南名胜 (10)</option>
          <option value="region-西北">西北名胜 (9)</option>
          <option value="region-华中">华中名胜 (6)</option>
          <option value="region-华南">华南名胜 (2)</option>
          <option value="region-东北">东北名胜 (3)</option>
        `;
      } else if (currentSeriesKey === "solar_terms") {
        filter.style.display = "";
        filter.innerHTML = `
          <option value="all">全部节气 (24)</option>
          <option value="season-春">春季物候 (6)</option>
          <option value="season-夏">夏季物候 (6)</option>
          <option value="season-秋">秋季物候 (6)</option>
          <option value="season-冬">冬季物候 (6)</option>
        `;
      } else if (currentSeriesKey === "shanhaijing") {
        filter.style.display = "";
        filter.innerHTML = `
          <option value="all">全部山海神异 (10)</option>
        `;
      } else if (currentSeriesKey === "zodiac") {
        filter.style.display = "";
        filter.innerHTML = `
          <option value="all">全部生肖瑞兽 (12)</option>
        `;
      } else {
        filter.style.display = "";
        filter.innerHTML = `
          <option value="all">全部世界城市 (30)</option>
        `;
      }
    }

    function updateHeader() {
      const col = getCollection();
      heroKicker.textContent = col.kicker;
      heroTitle.innerHTML = col.headline;
      heroDesc.textContent = col.desc;
      document.title = `${col.title} · 橡胶戳艺术印记`;
    }

    function render() {
      const col = getCollection();
      const q = search.value.trim().toLowerCase();
      const f = filter.value;

      currentFilteredRows = col.items.filter(x => {
        const titleStr = (x.city || x.title || x.name || "") + " " + (x.animal || "") + " " + (x.season || "") + " " + (x.region || "") + " " + (x.province || "");
        const textToMatch = (titleStr + " " + (x.features || "") + " " + (x.keywords || []).join(" ")).toLowerCase();
        const matchesQuery = !q || textToMatch.includes(q);
        
        let matchesFilter = true;
        if (f && f.startsWith("season-")) matchesFilter = (x.season === f.replace("season-", ""));
        if (f && f.startsWith("region-")) matchesFilter = (x.region && x.region.includes(f.replace("region-", "")));

        return matchesQuery && matchesFilter;
      });

      count.textContent = `${currentFilteredRows.length} / ${col.items.length} ${col.title}`;

      if (!currentFilteredRows.length) {
        grid.innerHTML = '<div class="empty">没有找到匹配的橡胶戳印记。</div>';
        return;
      }

      grid.innerHTML = currentFilteredRows.map((x, idx) => {
        const displayName = x.city || x.title || x.name;
        const badgeLabel = col.badgeFormat ? col.badgeFormat.replace("{id}", String(x.id).padStart(2, "0")) : `NO. ${String(x.id).padStart(2, "0")}`;
        const stamped = isStamped(currentSeriesKey, x.id);

        return `
          <article class="card" data-id="${x.id}" data-index="${idx}">
            <div class="frame" onclick="openModal(${idx})">
              <img class="stamp-img" src="${x.output}" alt="${displayName} 橡胶戳海报" onerror="this.src='placeholder.svg'">
              <span class="badge">${badgeLabel}</span>
              ${stamped ? `
                <div class="stamped-seal">
                  <span class="seal-inner-char">印</span>
                  <span>COLLECTED</span>
                </div>
              ` : ""}
            </div>
            <div class="card-info">
              <h2 onclick="openModal(${idx})">${displayName}</h2>
              <div class="meta">${x.features || ""}</div>
              <div class="keywords">${(x.keywords || []).join(" · ")}</div>
              <div class="card-actions">
                <button class="btn-card-action btn-card-stamp ${stamped ? "stamped" : ""}" onclick="toggleStamp('${currentSeriesKey}', ${x.id})" title="在印记收集册中盖章">
                  ${stamped ? "已盖印" : "盖章"}
                </button>
                <button class="btn-card-action" onclick="addToJournalDirect('${currentSeriesKey}', ${x.id})" title="将此印章贴入手账本">
                  贴入手账
                </button>
                <button class="btn-card-action" onclick="openExLibrisFor(${idx})" title="制作专属藏书票">
                  藏书票
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function switchSeries(key) {
      if (currentSeriesKey === key) return;
      currentSeriesKey = key;
      tabs.forEach(t => {
        const isAct = t.dataset.series === key;
        t.classList.toggle("active", isAct);
        if (isAct) {
          try {
            t.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
          } catch(e) {}
        }
      });
      window.location.hash = key;
      updateHeader();
      initFilterOptions();
      search.value = "";
      render();
    }

    tabs.forEach(t => {
      t.addEventListener("click", () => switchSeries(t.dataset.series));
    });

    search.oninput = render;
    filter.onchange = render;

    /* -------------------------------------------------------------
       5. Lightbox Modal
       ------------------------------------------------------------- */
    function updateModalStampBtn() {
      if (currentModalIndex < 0 || currentModalIndex >= currentFilteredRows.length) return;
      const x = currentFilteredRows[currentModalIndex];
      const stamped = isStamped(currentSeriesKey, x.id);
      const btn = document.querySelector("#modal-stamp-btn");
      btn.className = `btn-modal-action btn-modal-stamp ${stamped ? "stamped" : ""}`;
      btn.innerHTML = stamped ? "<span>已盖入收集册</span>" : "<span>盖入收集册</span>";
    }

    function openModal(index) {
      if (index < 0 || index >= currentFilteredRows.length) return;
      currentModalIndex = index;
      const x = currentFilteredRows[index];
      const col = getCollection();
      const displayName = x.city || x.title || x.name;

      document.querySelector("#big").src = x.output;
      document.querySelector("#big").alt = displayName;
      document.querySelector("#number").textContent = `${col.titleEn.toUpperCase()} ${String(x.id).padStart(2, "0")} / ${col.items.length}`;
      document.querySelector("#title").textContent = displayName;
      document.querySelector("#details").textContent = x.features || "";
      document.querySelector("#desc").textContent = (x.keywords || []).join(" · ");
      document.querySelector("#colors-info").textContent = x.colors ? `印层配色：${x.colors}` : "";
      
      updateModalStampBtn();
      document.querySelector("#lightbox").classList.add("open");
    }

    document.querySelector("#modal-stamp-btn").onclick = () => {
      const x = currentFilteredRows[currentModalIndex];
      toggleStamp(currentSeriesKey, x.id);
    };

    document.querySelector("#modal-exlibris-btn").onclick = () => {
      document.querySelector("#lightbox").classList.remove("open");
      openExLibrisFor(currentModalIndex);
    };

    document.querySelector("#close").onclick = () => document.querySelector("#lightbox").classList.remove("open");
    document.querySelector("#lightbox").onclick = e => {
      if (e.target.id === "lightbox") e.currentTarget.classList.remove("open");
    };

    document.querySelector("#btn-prev").onclick = () => {
      if (currentModalIndex > 0) openModal(currentModalIndex - 1);
      else openModal(currentFilteredRows.length - 1);
    };

    document.querySelector("#btn-next").onclick = () => {
      if (currentModalIndex < currentFilteredRows.length - 1) openModal(currentModalIndex + 1);
      else openModal(0);
    };

    // Keyboard Arrow Navigation
    window.addEventListener("keydown", e => {
      if (!document.querySelector("#lightbox").classList.contains("open")) return;
      if (e.key === "Escape") document.querySelector("#lightbox").classList.remove("open");
      else if (e.key === "ArrowLeft") document.querySelector("#btn-prev").click();
      else if (e.key === "ArrowRight") document.querySelector("#btn-next").click();
    });

    // Mobile Touch Swipe Gesture Support
    let touchStartX = 0;
    let touchStartY = 0;
    const lightboxEl = document.querySelector("#lightbox");
    lightboxEl.addEventListener("touchstart", e => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    lightboxEl.addEventListener("touchend", e => {
      if (e.changedTouches.length === 1) {
        const diffX = e.changedTouches[0].clientX - touchStartX;
        const diffY = e.changedTouches[0].clientY - touchStartY;
        // Horizontal swipe gesture threshold
        if (Math.abs(diffX) > 40 && Math.abs(diffY) < 65) {
          if (diffX < 0) {
            document.querySelector("#btn-next").click();
          } else {
            document.querySelector("#btn-prev").click();
          }
        }
      }
    }, { passive: true });

    /* -------------------------------------------------------------
       6. Stamp Passport Modal & Postcard Canvas Exporter
       ------------------------------------------------------------- */
    const passportLightbox = document.querySelector("#passport-lightbox");
    document.querySelector("#btn-open-passport").onclick = openPassportModal;
    document.querySelector("#passport-close").onclick = () => passportLightbox.classList.remove("open");
    passportLightbox.onclick = e => {
      if (e.target.id === "passport-lightbox") passportLightbox.classList.remove("open");
    };

    function openPassportModal() {
      renderPassportGrid();
      passportLightbox.classList.add("open");
    }

    function renderPassportGrid() {
      const pGrid = document.querySelector("#passport-grid");
      const totalCount = getTotalCollectedCount();
      document.querySelector("#passport-stats-text").textContent = `已盖章收集 ${totalCount} 枚印记`;

      const collectedKeys = Object.keys(collectedMap);
      if (!collectedKeys.length) {
        pGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted);">您的收集册还是空的。在画廊中点击任意印章下方的【盖章】即可在此收录！</div>`;
        return;
      }

      pGrid.innerHTML = collectedKeys.map(key => {
        const [sKey, idStr] = key.split("_");
        const id = parseInt(idStr, 10);
        const col = window.COLLECTIONS[sKey];

    document.querySelector("#btn-export-postcard").onclick = () => {

        return;
      }

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const w = 1200;
      const h = 800;
      canvas.width = w;
      canvas.height = h;

      // Draw postcard paper
      ctx.fillStyle = "#f5eddc";
      ctx.fillRect(0, 0, w, h);

      // Postcard deckle border
      ctx.strokeStyle = "#cfc2ad";
      ctx.lineWidth = 4;
      ctx.strokeRect(20, 20, w - 40, h - 40);

      ctx.strokeStyle = "#b83b26";
      ctx.lineWidth = 1;
      ctx.strokeRect(28, 28, w - 56, h - 56);

      // Postcard Airmail top stripes
      ctx.fillStyle = "#8d4d39";
      ctx.font = "bold 26px Georgia, serif";
      ctx.fillText("RUBBER STAMP TRAVEL PASSPORT", 50, 75);

      ctx.fillStyle = "#746d60";
      ctx.font = "14px ui-monospace, monospace";
      ctx.fillText("OFFICIAL TRAVEL FIELD-NOTE ARCHIVE • COLLECTOR'S SHEET", 50, 100);

      // Postmark stamp circle
      ctx.save();
      ctx.translate(w - 140, 100);
      ctx.rotate(-0.15);
      ctx.strokeStyle = "#b83b26";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 48, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "#b83b26";
      ctx.font = "bold 9px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText("RUBBER STAMP ARCHIVE", 0, -22);
      ctx.font = "bold 13px ui-monospace, monospace";
      ctx.fillText(new Date().toISOString().slice(0, 10), 0, 4);
      ctx.font = "bold 9px ui-monospace, monospace";
      ctx.fillText("★ CERTIFIED ★", 0, 26);
      ctx.restore();

      // Draw collected stamps collage
      const maxStamps = Math.min(keys.length, 12);
      const cols = 6;
      const rows = 2;
      const stampW = 145;
      const stampH = 180;
      const startX = 60;
      const startY = 160;
      const gapX = 35;
      const gapY = 40;

      let loadedImages = 0;
      const itemsToDraw = [];

      for (let i = 0; i < maxStamps; i++) {
        const [sKey, idStr] = keys[i].split("_");
        const col = window.COLLECTIONS[sKey];
        if (!col) continue;
        const item = col.items.find(x => x.id === parseInt(idStr, 10));
        if (item) itemsToDraw.push({ item, sKey });
      }

      if (!itemsToDraw.length) return;

      itemsToDraw.forEach((entry, idx) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = entry.item.output;
        img.onload = () => {
          loadedImages++;
          const colIdx = idx % cols;
          const rowIdx = Math.floor(idx / cols);
          const x = startX + colIdx * (stampW + gapX);
          const y = startY + rowIdx * (stampH + gapY);

          // Stamp frame
          ctx.save();
          ctx.fillStyle = "#ebdcc7";
          ctx.fillRect(x - 6, y - 6, stampW + 12, stampH + 30);
          ctx.strokeStyle = "#c2b39c";
          ctx.lineWidth = 1;
          ctx.strokeRect(x - 6, y - 6, stampW + 12, stampH + 30);

          // Apply current ink filter if needed
          if (currentInk === "cinnabar") ctx.filter = "sepia(0.9) saturate(3.5) hue-rotate(-52deg) contrast(1.2)";
          else if (currentInk === "charcoal") ctx.filter = "grayscale(1) contrast(1.25) brightness(0.95)";
          else ctx.filter = "none";

          ctx.drawImage(img, x, y, stampW, stampH);
          ctx.restore();

          // Title
          ctx.fillStyle = "#292722";
          ctx.font = "12px 'Songti SC', serif";
          ctx.textAlign = "center";
          const title = entry.item.city || entry.item.title || entry.item.name;
          ctx.fillText(title, x + stampW / 2, y + stampH + 16);

          if (loadedImages === itemsToDraw.length) {
            // Footer text
            ctx.fillStyle = "#746d60";
            ctx.font = "12px ui-monospace, monospace";
            ctx.textAlign = "left";
            ctx.fillText(`TOTAL COLLECTED: ${keys.length} STAMPS • CREATED ON XIAOSANG.CC`, 50, h - 45);

            // Download
            const link = document.createElement("a");
            link.download = `Stamp_Passport_Postcard_${new Date().toISOString().slice(0,10)}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
          }
        };
        img.onerror = () => {
          loadedImages++;
        };
      });

    function drawExLibris(exportMode = false) {
      if (!exlibrisTargetItem) return;

      const cw = exportMode ? 1200 : 600;
      const ch = exportMode ? 1600 : 800;
      const scale = exportMode ? 2 : 1;

      exCanvas.width = cw;
      exCanvas.height = ch;

      const owner = document.querySelector("#ex-owner").value.trim() || "HOLY NOVA";
      const motto = document.querySelector("#ex-motto").value;
      const borderStyle = document.querySelector("#ex-border").value;
      const paperColor = document.querySelector("#ex-paper").value;
      const inkSetting = document.querySelector("#ex-ink").value;

      // 1. Paper Background
      exCtx.fillStyle = paperColor;
      exCtx.fillRect(0, 0, cw, ch);

      // Subtle paper texture speckles
      exCtx.fillStyle = "rgba(100, 80, 60, 0.03)";
      for (let i = 0; i < 800 * scale; i++) {
        exCtx.fillRect(Math.random() * cw, Math.random() * ch, 1.5, 1.5);
      }

      // 2. Borders
      const margin = 28 * scale;
      exCtx.strokeStyle = "#292722";
      if (borderStyle === "classical") {
        exCtx.lineWidth = 3 * scale;
        exCtx.strokeRect(margin, margin, cw - margin * 2, ch - margin * 2);
        exCtx.lineWidth = 1 * scale;
        exCtx.strokeRect(margin + 6 * scale, margin + 6 * scale, cw - (margin + 6 * scale) * 2, ch - (margin + 6 * scale) * 2);
        
        // Corner rosettes
        const cs = 14 * scale;
        [
          [margin, margin], [cw - margin, margin],
          [margin, ch - margin], [cw - margin, ch - margin]
        ].forEach(([cx, cy]) => {
          exCtx.fillStyle = "#b83b26";
          exCtx.fillRect(cx - cs / 2, cy - cs / 2, cs, cs);
        });
      } else if (borderStyle === "oriental") {
        exCtx.lineWidth = 4 * scale;
        exCtx.strokeRect(margin, margin, cw - margin * 2, ch - margin * 2);
        exCtx.strokeStyle = "#b83b26";
        exCtx.lineWidth = 1.5 * scale;
        exCtx.strokeRect(margin + 8 * scale, margin + 8 * scale, cw - (margin + 8 * scale) * 2, ch - (margin + 8 * scale) * 2);
      } else {
        exCtx.lineWidth = 1.5 * scale;
        exCtx.strokeRect(margin, margin, cw - margin * 2, ch - margin * 2);
      }

      // 3. Top Motto (EX LIBRIS)
      exCtx.fillStyle = "#8d4d39";
      exCtx.font = `bold ${28 * scale}px Georgia, serif`;
      exCtx.textAlign = "center";
      exCtx.fillText(motto, cw / 2, 85 * scale);

      // 4. Center Stamp Artwork
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = exlibrisTargetItem.output;
      img.onload = () => {
        const stampW = 360 * scale;
        const stampH = 450 * scale;
        const stampX = (cw - stampW) / 2;
        const stampY = 120 * scale;

        exCtx.save();
        // Inner photo mount frame
        exCtx.fillStyle = "#ebdcc7";
        exCtx.fillRect(stampX - 8 * scale, stampY - 8 * scale, stampW + 16 * scale, stampH + 16 * scale);
        exCtx.strokeStyle = "#cfc2ad";
        exCtx.lineWidth = 1 * scale;
        exCtx.strokeRect(stampX - 8 * scale, stampY - 8 * scale, stampW + 16 * scale, stampH + 16 * scale);

        // Apply Ink Filter to Canvas
        let effectiveInk = inkSetting === "current" ? currentInk : inkSetting;
        if (effectiveInk === "cinnabar") exCtx.filter = "sepia(0.9) saturate(3.5) hue-rotate(-52deg) contrast(1.2)";
        else if (effectiveInk === "charcoal") exCtx.filter = "grayscale(1) contrast(1.25) brightness(0.95)";
        else exCtx.filter = "none";

        exCtx.drawImage(img, stampX, stampY, stampW, stampH);
        exCtx.restore();

        // 5. Subject Title Banner
        const displayName = exlibrisTargetItem.city || exlibrisTargetItem.title || exlibrisTargetItem.name;
        exCtx.fillStyle = "#292722";
        exCtx.font = `${18 * scale}px "Songti SC", Georgia, serif`;
        exCtx.textAlign = "center";
        exCtx.fillText(`— ${displayName} —`, cw / 2, 620 * scale);

        // 6. Owner Name Box
        const boxY = 660 * scale;
        const boxW = 380 * scale;
        const boxH = 55 * scale;
        const boxX = (cw - boxW) / 2;

        exCtx.fillStyle = "#fffaf2";
        exCtx.fillRect(boxX, boxY, boxW, boxH);
        exCtx.strokeStyle = "#8d4d39";
        exCtx.lineWidth = 1.5 * scale;
        exCtx.strokeRect(boxX, boxY, boxW, boxH);

        exCtx.fillStyle = "#8d4d39";
        exCtx.font = `bold ${20 * scale}px "Songti SC", Georgia, serif`;
        exCtx.textAlign = "center";
        exCtx.fillText(owner, cw / 2, boxY + 36 * scale);

        // 7. Micro footer
        exCtx.fillStyle = "#746d60";
        exCtx.font = `${11 * scale}px ui-monospace, monospace`;
        exCtx.fillText("RUBBER STAMP EX-LIBRIS • EDITION 2026", cw / 2, ch - 40 * scale);
      };
    }

    /* -------------------------------------------------------------
       9. Stamp Journal & Collage Book Studio (盖章手账拼图本)
       ------------------------------------------------------------- */
    const journalLightbox = document.querySelector("#journal-lightbox");
    const journalCanvas = document.querySelector("#journal-canvas");
    const journalCtx = journalCanvas.getContext("2d");
    let journalStamps = []; // Items in current journal page
    let activeSlotIndex = 0; // Currently focused slot for insertion / swap
    let journalPickerCategory = "all";

    const stampImgCache = new Map();
    function getCachedStampImage(url) {
      if (!url) return Promise.resolve(null);
      if (stampImgCache.has(url)) {
        const cached = stampImgCache.get(url);
        if (cached && cached.complete && cached.naturalWidth > 0) return Promise.resolve(cached);
      }
      return new Promise((resolve) => {
        const img = new Image();
        if (url.startsWith("http://") || url.startsWith("https://")) {
          img.crossOrigin = "anonymous";
        }
        img.src = url;
        img.onload = () => {
          stampImgCache.set(url, img);
          resolve(img);
        };
        img.onerror = () => {
          console.warn("Failed to load image:", url);
          resolve(null);
        };
      });
    }

    function getAllStampsList() {
      const list = [];
      if (!window.COLLECTIONS) return list;
      Object.keys(window.COLLECTIONS).forEach(seriesKey => {
        const col = window.COLLECTIONS[seriesKey];
        (col.items || []).forEach(item => {
          list.push({
            ...item,
            seriesKey: seriesKey,
            seriesTitle: col.title,
            badgeLabel: col.badgeFormat ? col.badgeFormat.replace("{id}", String(item.id).padStart(2, "0")) : `NO. ${String(item.id).padStart(2, "0")}`
          });
        });
      });
      return list;
    }

    function getLayoutCapacity(layoutKey) {
      switch (layoutKey) {
        case "grid2x2": return 4;
        case "grid2x3": return 6;
        case "grid3x3": return 8;
        case "featured1p4": return 5;
        default: return 6;
      }
    }

    function updateJournalBadge() {
      const badge = document.querySelector("#journal-count-badge");
      if (badge) badge.textContent = journalStamps.length;
      const counter = document.querySelector("#stamp-slot-counter");
      const cap = getLayoutCapacity(document.querySelector("#journal-layout").value);
      if (counter) counter.textContent = `已选 ${journalStamps.length} / ${cap}`;
      const pickerCollCount = document.querySelector("#picker-collected-count");
      if (pickerCollCount) pickerCollCount.textContent = getTotalCollectedCount();
    }

    function openJournalModal() {
      // If journal is empty and user has collected stamps, prefill with collected stamps!
      if (journalStamps.length === 0) {
        const all = getAllStampsList();
        const collected = all.filter(x => isStamped(x.seriesKey, x.id));
        const cap = getLayoutCapacity(document.querySelector("#journal-layout").value);
        if (collected.length > 0) {
          journalStamps = collected.slice(0, cap);
        } else {
          // Default prefill with 6 iconic prints (Shanghai, Rat, Lichun, Jiuweihu, Beijing, Dragon)
          const defaults = [
            all.find(x => x.name === "上海" || x.city === "上海") || all[0],
            all.find(x => x.name === "子鼠") || all[30],
            all.find(x => x.name === "立春") || all[42],
            all.find(x => x.name === "九尾狐") || all[66],
            all.find(x => x.name === "北京" || x.city === "北京") || all[1],
            all.find(x => x.name === "辰龙") || all[34],
          ].filter(Boolean);
          journalStamps = defaults.slice(0, cap);
        }
      }

      journalLightbox.classList.add("open");
      updateJournalBadge();
      renderPickerGrid();
      drawJournal();
    }

    document.querySelector("#btn-open-journal").onclick = openJournalModal;
    document.querySelector("#journal-close").onclick = () => journalLightbox.classList.remove("open");

      document.querySelector("#passport-lightbox").classList.remove("open");
      fillWithCollectedStamps();

    window.addToJournalDirect = function(seriesKey, id) {
      const all = getAllStampsList();
      const target = all.find(x => x.seriesKey === seriesKey && x.id === id);
      if (!target) return;

      const cap = getLayoutCapacity(document.querySelector("#journal-layout").value);
      const existingIdx = journalStamps.findIndex(x => x.output === target.output);

      if (existingIdx >= 0) {
        journalStamps.splice(existingIdx, 1);
        showToast(`已从手账移出「${target.city || target.title || target.name}」`);
      } else {
        if (journalStamps.length < cap) {
          journalStamps.push(target);
          activeSlotIndex = journalStamps.length % cap;
        } else {
          journalStamps[activeSlotIndex] = target;
          activeSlotIndex = (activeSlotIndex + 1) % cap;
        }
        playStampSound();
        showToast(`已将「${target.city || target.title || target.name}」填入手账`);
      }

      updateJournalBadge();
      renderPickerGrid();
      if (journalLightbox.classList.contains("open")) {
        drawJournal();
      }
    };

    function renderPickerGrid() {
      const gridEl = document.querySelector("#stamp-picker-grid");
      if (!gridEl) return;
      const all = getAllStampsList();
      let filtered = all;

      if (journalPickerCategory === "scenic_spots") filtered = all.filter(x => x.seriesKey === "scenic_spots");
      else if (journalPickerCategory === "cities") filtered = all.filter(x => x.seriesKey === "cities");
      else if (journalPickerCategory === "zodiac") filtered = all.filter(x => x.seriesKey === "zodiac");
      else if (journalPickerCategory === "solar_terms") filtered = all.filter(x => x.seriesKey === "solar_terms");
      else if (journalPickerCategory === "shanhaijing") filtered = all.filter(x => x.seriesKey === "shanhaijing");
      else if (journalPickerCategory === "collected") filtered = all.filter(x => isStamped(x.seriesKey, x.id));

      if (!filtered.length) {
        gridEl.innerHTML = '<div style="grid-column:span 4;text-align:center;padding:24px 8px;font-size:12px;color:var(--muted);">暂无符合条件的印章</div>';
        return;
      }

      gridEl.innerHTML = filtered.map(item => {
        const inJournal = journalStamps.some(x => x.output === item.output);
        const displayName = item.city || item.title || item.name;
        return `
          <div class="picker-stamp-item ${inJournal ? "in-journal" : ""}" data-output="${item.output}" title="点击贴入或移除手账本">
            <img src="${item.output}" alt="${displayName}" loading="lazy">
            <div class="picker-stamp-item-label">${displayName}</div>
            ${inJournal ? '<span class="picker-stamp-item-badge">已选</span>' : ""}
          </div>
        `;
      }).join("");

      gridEl.querySelectorAll(".picker-stamp-item").forEach(el => {
        el.onclick = () => {
          const out = el.dataset.output;
          const target = all.find(x => x.output === out);
          if (!target) return;
          addToJournalDirect(target.seriesKey, target.id);
        };
      });
    }
