    });

    // Quick Action: Fill with collected stamps
    function fillWithCollectedStamps() {
      const all = getAllStampsList();
      const collected = all.filter(x => isStamped(x.seriesKey, x.id));
      const cap = getLayoutCapacity(document.querySelector("#journal-layout").value);
      if (collected.length === 0) {
        showToast("收集册暂无印章，已随机挑选");
        randomJournalPage();
        return;
      }
      journalStamps = collected.slice(0, cap);
      activeSlotIndex = 0;
      playStampSound();
      updateJournalBadge();
      renderPickerGrid();
      drawJournal();
      showToast(`已自动填入 ${journalStamps.length} 枚已收集印章`);
    }

    function randomJournalPage() {
      const all = getAllStampsList();
      const cap = getLayoutCapacity(document.querySelector("#journal-layout").value);
      const shuffled = [...all].sort(() => 0.5 - Math.random());
      journalStamps = shuffled.slice(0, cap);
      activeSlotIndex = 0;
      playStampSound();
      updateJournalBadge();
      renderPickerGrid();
      drawJournal();
      showToast(`已随机生成一页 ${journalStamps.length} 款印章手账`);
    }

    function clearJournalPage() {
      journalStamps = [];
      activeSlotIndex = 0;
      updateJournalBadge();
      renderPickerGrid();
      drawJournal();
      showToast("已清空当前手账页");
    }

    document.querySelector("#btn-fill-collected").onclick = fillWithCollectedStamps;
    document.querySelector("#btn-random-journal").onclick = randomJournalPage;
    document.querySelector("#btn-clear-journal").onclick = clearJournalPage;

    // Canvas click to select slot
    journalCanvas.onclick = (e) => {
      const rect = journalCanvas.getBoundingClientRect();
      const scaleX = journalCanvas.width / rect.width;
      const scaleY = journalCanvas.height / rect.height;
      const clickX = (e.clientX - rect.left) * scaleX;
      const clickY = (e.clientY - rect.top) * scaleY;

      const layoutKey = document.querySelector("#journal-layout").value;
      const slots = computeSlotRects(layoutKey, 1, 1200, 800);

      slots.forEach((slot, idx) => {
        if (clickX >= slot.x - 10 && clickX <= slot.x + slot.w + 10 &&
            clickY >= slot.y - 10 && clickY <= slot.y + slot.h + 30) {
          activeSlotIndex = idx;
          drawJournal();
          showToast(`当前选中第 ${idx + 1} 个印位，点击右侧印章填入`);
        }
      });
    };

    // Form inputs triggers
    const journalInputs = ["#journal-layout", "#journal-paper", "#journal-title-input", "#journal-author-input", "#journal-subtitle-input", "#journal-ink", "#journal-natural-tilt"];
    journalInputs.forEach(sel => {
      const el = document.querySelector(sel);
      if (el) {
        el.oninput = () => {
          if (sel === "#journal-layout") {
            const cap = getLayoutCapacity(el.value);
            if (journalStamps.length > cap) journalStamps = journalStamps.slice(0, cap);
            updateJournalBadge();
          }
          drawJournal();
        };
        el.onchange = () => {
          if (sel === "#journal-layout") {
            const cap = getLayoutCapacity(el.value);
            if (journalStamps.length > cap) journalStamps = journalStamps.slice(0, cap);
            updateJournalBadge();
          }
          drawJournal();
        };
      }
    });

    // Slot Coordinate Engine
    function computeSlotRects(layoutKey, scale, cw, ch) {
      const margin = 28 * scale;
      const spineX = cw / 2;
      const topY = 95 * scale;
      const leftX = margin + 28 * scale;
      const rightX = spineX + 24 * scale;

      const slots = [];

      if (layoutKey === "grid2x2") {
        // 4 slots: 2 on Left Page, 2 on Right Page
        const w = 210 * scale;
        const h = 262 * scale;
        const y = topY + 115 * scale;
        // Left Page
        slots.push({ x: leftX + 25 * scale, y: y, w: w, h: h });
        slots.push({ x: leftX + 265 * scale, y: y, w: w, h: h });
        // Right Page
        slots.push({ x: rightX + 25 * scale, y: y, w: w, h: h });
        slots.push({ x: rightX + 265 * scale, y: y, w: w, h: h });
      } else if (layoutKey === "grid2x3") {
        // 6 slots: 3 on Left, 3 on Right (Staggered artistic balance)
        const w = 200 * scale;
        const h = 250 * scale;
        // Left Page
        slots.push({ x: leftX + 145 * scale, y: topY + 10 * scale, w: w, h: h });
        slots.push({ x: leftX + 25 * scale, y: topY + 310 * scale, w: w, h: h });
        slots.push({ x: leftX + 265 * scale, y: topY + 310 * scale, w: w, h: h });
        // Right Page
        slots.push({ x: rightX + 25 * scale, y: topY + 10 * scale, w: w, h: h });
        slots.push({ x: rightX + 265 * scale, y: topY + 10 * scale, w: w, h: h });
        slots.push({ x: rightX + 145 * scale, y: topY + 310 * scale, w: w, h: h });
      } else if (layoutKey === "grid3x3") {
        // 8 slots: 4 on Left (2x2), 4 on Right (2x2)
        const w = 200 * scale;
        const h = 250 * scale;
        // Left Page
        slots.push({ x: leftX + 25 * scale, y: topY + 10 * scale, w: w, h: h });
        slots.push({ x: leftX + 265 * scale, y: topY + 10 * scale, w: w, h: h });
        slots.push({ x: leftX + 25 * scale, y: topY + 310 * scale, w: w, h: h });
        slots.push({ x: leftX + 265 * scale, y: topY + 310 * scale, w: w, h: h });
        // Right Page
        slots.push({ x: rightX + 25 * scale, y: topY + 10 * scale, w: w, h: h });
        slots.push({ x: rightX + 265 * scale, y: topY + 10 * scale, w: w, h: h });
        slots.push({ x: rightX + 25 * scale, y: topY + 310 * scale, w: w, h: h });
        slots.push({ x: rightX + 265 * scale, y: topY + 310 * scale, w: w, h: h });
      } else if (layoutKey === "featured1p4") {
        // 5 slots: 1 Feature Hero on Left + 4 on Right (2x2)
        const heroW = 360 * scale;
        const heroH = 450 * scale;
        slots.push({ x: leftX + 70 * scale, y: topY + 60 * scale, w: heroW, h: heroH, isHero: true });

        const w = 200 * scale;
        const h = 250 * scale;
        slots.push({ x: rightX + 25 * scale, y: topY + 10 * scale, w: w, h: h });
        slots.push({ x: rightX + 265 * scale, y: topY + 10 * scale, w: w, h: h });
        slots.push({ x: rightX + 25 * scale, y: topY + 310 * scale, w: w, h: h });
        slots.push({ x: rightX + 265 * scale, y: topY + 310 * scale, w: w, h: h });
      }

      return slots;
    }

    // Canvas Journal Renderer
    const FIXED_TILT_ANGLES = [-1.8, 1.4, -1.1, 1.7, -1.5, 0.9, -1.2, 1.6];

    async function drawJournal(exportMode = false, targetCanvas = null) {
      const cvs = targetCanvas || journalCanvas;
      const ctx = cvs.getContext("2d");

      const cw = exportMode ? 2400 : 1200;
      const ch = exportMode ? 1600 : 800;
      const scale = exportMode ? 2 : 1;

      cvs.width = cw;
      cvs.height = ch;

      const layoutKey = document.querySelector("#journal-layout").value;
      const paperKey = document.querySelector("#journal-paper").value;
      const titleText = document.querySelector("#journal-title-input").value.trim() || "《四时风物 · 游历手账》";
      const authorText = document.querySelector("#journal-author-input").value.trim() || "COLLECTED BY HOLY NOVA";
      const subtitleText = document.querySelector("#journal-subtitle-input").value.trim() || "FIELD NOTES & SEALS • EDITION 2026";
      const inkSetting = document.querySelector("#journal-ink").value;
      const naturalTilt = document.querySelector("#journal-natural-tilt").checked;

      // 1. Desk Background
      ctx.fillStyle = "#1e1b18";
      ctx.fillRect(0, 0, cw, ch);

      // 2. Open Book Spread
      const margin = 24 * scale;
      const bw = cw - margin * 2;
      const bh = ch - margin * 2;
      const radius = 10 * scale;

      // Soft Book Shadow
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.55)";
      ctx.shadowBlur = 28 * scale;
      ctx.shadowOffsetY = 14 * scale;

      // Paper Background Base
      let paperBg = "#f5eedd";
      if (paperKey === "kraft") paperBg = "#d8ba8b";
      else if (paperKey === "dot_grid") paperBg = "#f8f5eb";
      else if (paperKey === "sage_parchment") paperBg = "#e1e9e2";
      else if (paperKey === "clean_cream") paperBg = "#fffef9";

      ctx.fillStyle = paperBg;
      ctx.beginPath();
      ctx.roundRect(margin, margin, bw, bh, radius);
      ctx.fill();
      ctx.restore();

      // Subtle Paper Texture Specks
      ctx.fillStyle = paperKey === "kraft" ? "rgba(70, 45, 20, 0.04)" : "rgba(100, 80, 50, 0.035)";
      for (let i = 0; i < 1500 * scale; i++) {
        const px = margin + Math.random() * bw;
        const py = margin + Math.random() * bh;
        ctx.fillRect(px, py, 1.5 * scale, 1.5 * scale);
      }

      // If Dot Grid Paper: draw dot matrix
      if (paperKey === "dot_grid") {
        ctx.fillStyle = "rgba(160, 140, 110, 0.28)";
        const step = 24 * scale;
        for (let x = margin + 30 * scale; x < cw - margin - 30 * scale; x += step) {
          if (Math.abs(x - cw / 2) < 25 * scale) continue; // skip center fold
          for (let y = margin + 70 * scale; y < ch - margin - 50 * scale; y += step) {
            ctx.beginPath();
            ctx.arc(x, y, 1.2 * scale, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // 3. Center Spine Fold & Book Depth
      const spineX = cw / 2;

      // Spine shadow gradient
      const spineGrad = ctx.createLinearGradient(spineX - 35 * scale, 0, spineX + 35 * scale, 0);
      spineGrad.addColorStop(0, "rgba(0,0,0,0)");
      spineGrad.addColorStop(0.35, "rgba(0,0,0,0.06)");
      spineGrad.addColorStop(0.5, "rgba(0,0,0,0.18)");
      spineGrad.addColorStop(0.65, "rgba(0,0,0,0.06)");
      spineGrad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = spineGrad;
      ctx.fillRect(spineX - 35 * scale, margin, 70 * scale, bh);

      // Spine Center Crease Line
      ctx.strokeStyle = "rgba(120, 100, 75, 0.4)";
      ctx.lineWidth = 1 * scale;
      ctx.beginPath();
      ctx.moveTo(spineX, margin);
      ctx.lineTo(spineX, ch - margin);
      ctx.stroke();

      // Stitch Thread / Hole Marks along spine
      const stitchY = [65, 180, 310, 440, 570, 700, 750];
      stitchY.forEach(sy => {
        const y = sy * scale;
        ctx.fillStyle = "#3a3229";
        ctx.beginPath();
        ctx.arc(spineX, y, 2.5 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#8d7962";
        ctx.lineWidth = 1 * scale;
        ctx.beginPath();
        ctx.moveTo(spineX - 4 * scale, y);
        ctx.lineTo(spineX + 4 * scale, y);
        ctx.stroke();
      });

      // 4. Inner Margins & Border Ornaments
      ctx.strokeStyle = "rgba(140, 120, 95, 0.35)";
      ctx.lineWidth = 1 * scale;

      // Left Page inner frame
      const leftInnerX = margin + 18 * scale;
      const leftInnerW = spineX - leftInnerX - 18 * scale;
      const innerY = margin + 18 * scale;
      const innerH = bh - 36 * scale;
      ctx.strokeRect(leftInnerX, innerY, leftInnerW, innerH);

      // Right Page inner frame
      const rightInnerX = spineX + 18 * scale;
      const rightInnerW = cw - margin - 18 * scale - rightInnerX;
      ctx.strokeRect(rightInnerX, innerY, rightInnerW, innerH);

      // 5. Header Typography & Book Title
      // Left Header: Book Title
      ctx.fillStyle = "#292722";
      ctx.font = `bold ${21 * scale}px "Songti SC", Georgia, serif`;
      ctx.textAlign = "left";
      ctx.fillText(titleText, leftInnerX + 16 * scale, innerY + 32 * scale);

      // Subtitle under Title
      ctx.fillStyle = "#7c7263";
      ctx.font = `${10 * scale}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      ctx.fillText(subtitleText, leftInnerX + 16 * scale, innerY + 48 * scale);

      // Right Header: Author Signature & Stamp Seal
      ctx.textAlign = "right";
      ctx.fillStyle = "#5c5346";
      ctx.font = `bold ${12 * scale}px "Songti SC", Georgia, serif`;
      ctx.fillText(authorText, rightInnerX + rightInnerW - 48 * scale, innerY + 34 * scale);

      // Decorative Seal Stamp in Top-Right
      const sealX = rightInnerX + rightInnerW - 36 * scale;
      const sealY = innerY + 18 * scale;
      const sealS = 24 * scale;
      ctx.strokeStyle = "#b83b26";
      ctx.lineWidth = 1.5 * scale;
      ctx.strokeRect(sealX, sealY, sealS, sealS);
      ctx.fillStyle = "rgba(184, 59, 38, 0.08)";
      ctx.fillRect(sealX, sealY, sealS, sealS);
      ctx.fillStyle = "#b83b26";
      ctx.font = `bold ${13 * scale}px "Songti SC", serif`;
      ctx.textAlign = "center";
      ctx.fillText("印", sealX + sealS / 2, sealY + sealS / 2 + 5 * scale);

      // 6. Footer Information
      ctx.fillStyle = "#8a7f70";
      ctx.font = `${9.5 * scale}px ui-monospace, SFMono-Regular, monospace`;
      ctx.textAlign = "left";
      ctx.fillText("RUBBER STAMP FIELD JOURNAL • PAGE 01", leftInnerX + 16 * scale, innerY + innerH - 12 * scale);

      ctx.textAlign = "right";
      ctx.fillText("HAND-CARVED WOODBLOCK PRINTS • EDITION 2026", rightInnerX + rightInnerW - 16 * scale, innerY + innerH - 12 * scale);

      // 7. Calculate Slots & Preload Images
      const slots = computeSlotRects(layoutKey, scale, cw, ch);
      const cap = slots.length;

      // Preload images for current items
      const loadPromises = journalStamps.slice(0, cap).map(item => item ? getCachedStampImage(item.output) : Promise.resolve(null));
      const loadedImgs = await Promise.all(loadPromises);

      // 8. Render Each Slot
      slots.forEach((slot, idx) => {
        const item = journalStamps[idx];
        const img = loadedImgs[idx];
        const isOccupied = !!(item && img);

        const cx = slot.x + slot.w / 2;
        const cy = slot.y + slot.h / 2;
        const tilt = (naturalTilt ? (FIXED_TILT_ANGLES[idx % FIXED_TILT_ANGLES.length] || 0) : 0) * (Math.PI / 180);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(tilt);

        if (isOccupied) {
          // Soft Stamp Drop Shadow
          ctx.shadowColor = "rgba(45, 35, 25, 0.22)";
          ctx.shadowBlur = 8 * scale;
          ctx.shadowOffsetY = 4 * scale;

          // Backing Deckle Mount
          const pad = 4 * scale;
          ctx.fillStyle = "#fffdf7";
          ctx.fillRect(-slot.w / 2 - pad, -slot.h / 2 - pad, slot.w + pad * 2, slot.h + pad * 2);
          ctx.strokeStyle = "rgba(180, 160, 130, 0.5)";
          ctx.lineWidth = 1 * scale;
          ctx.strokeRect(-slot.w / 2 - pad, -slot.h / 2 - pad, slot.w + pad * 2, slot.h + pad * 2);

          // Apply Ink Filter to Canvas
          let effectiveInk = inkSetting === "current" ? currentInk : inkSetting;
          if (effectiveInk === "cinnabar") ctx.filter = "sepia(0.9) saturate(3.5) hue-rotate(-52deg) contrast(1.2)";
          else if (effectiveInk === "charcoal") ctx.filter = "grayscale(1) contrast(1.25) brightness(0.95)";
          else ctx.filter = "none";

          // Draw Stamp Art
          ctx.drawImage(img, -slot.w / 2, -slot.h / 2, slot.w, slot.h);

          // Reset Filter & Shadow for Captions
          ctx.filter = "none";
          ctx.shadowColor = "transparent";

          // Stamp Caption Underneath
          const displayName = item.city || item.title || item.name;
          const badge = item.badgeLabel || `NO. ${String(item.id).padStart(2, "0")}`;

          ctx.fillStyle = "#292722";
          ctx.font = `bold ${slot.isHero ? 15 * scale : 11 * scale}px "Songti SC", Georgia, serif`;
          ctx.textAlign = "center";
          ctx.fillText(displayName, 0, slot.h / 2 + (slot.isHero ? 20 * scale : 14 * scale));

          ctx.fillStyle = "#7c7263";
          ctx.font = `${slot.isHero ? 10 * scale : 8.5 * scale}px ui-monospace, monospace`;
          ctx.fillText(badge, 0, slot.h / 2 + (slot.isHero ? 34 * scale : 24 * scale));
        } else {
          // Empty Slot: Dashed Stamp Frame + Typographic Prompt
          ctx.strokeStyle = (idx === activeSlotIndex && !exportMode) ? "#8d4d39" : "rgba(160, 140, 110, 0.5)";
          ctx.lineWidth = (idx === activeSlotIndex && !exportMode) ? 2 * scale : 1.5 * scale;
          ctx.setLineDash([5 * scale, 4 * scale]);
          ctx.strokeRect(-slot.w / 2, -slot.h / 2, slot.w, slot.h);
          ctx.setLineDash([]);

          ctx.fillStyle = (idx === activeSlotIndex && !exportMode) ? "rgba(141, 77, 57, 0.06)" : "rgba(160, 140, 110, 0.04)";
          ctx.fillRect(-slot.w / 2, -slot.h / 2, slot.w, slot.h);

          ctx.fillStyle = (idx === activeSlotIndex && !exportMode) ? "#8d4d39" : "rgba(140, 120, 95, 0.65)";
          ctx.font = `300 ${22 * scale}px ui-monospace, monospace`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("+", 0, -8 * scale);

          ctx.font = `${10 * scale}px ui-monospace, monospace`;
          ctx.fillText(idx === activeSlotIndex && !exportMode ? "当前编辑位" : "点击填入印章", 0, 14 * scale);
        }

        // Highlight Active Slot with golden focus indicator
        if (idx === activeSlotIndex && !exportMode) {
          ctx.strokeStyle = "#b83b26";
          ctx.lineWidth = 2 * scale;
          ctx.strokeRect(-slot.w / 2 - 6 * scale, -slot.h / 2 - 6 * scale, slot.w + 12 * scale, slot.h + 12 * scale);
        }

        ctx.restore();
      });
    }

    // High-Resolution Export
    document.querySelector("#btn-download-journal").onclick = async () => {
      showToast("正在导出 2400×1600 高清手账跨页…");
      const exportCanvas = document.createElement("canvas");
      await drawJournal(true, exportCanvas);

      const titleText = document.querySelector("#journal-title-input").value.trim() || "四时风物手账";
      const cleanTitle = titleText.replace(/[《》\s]/g, "_");
      const link = document.createElement("a");
      link.download = `Stamp_Journal_${cleanTitle}_${Date.now()}.png`;
      link.href = exportCanvas.toDataURL("image/png");
      link.click();
      showToast("手账跨页导出成功");
    };

    // Print / PDF
    document.querySelector("#btn-print-journal").onclick = async () => {
      const exportCanvas = document.createElement("canvas");
      await drawJournal(true, exportCanvas);
      const imgData = exportCanvas.toDataURL("image/png");
      const printWin = window.open("", "_blank");
      if (!printWin) {
        alert("请允许弹出窗口以打印手账页");
        return;
      }
      printWin.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>打印印章手账页</title>
          <style>
            @page { size: landscape; margin: 0; }
            body { margin: 0; display: flex; align-items: center; justify-content: center; background: #fff; height: 100vh; }
            img { width: 100vw; height: auto; max-height: 100vh; object-fit: contain; }
          </style>
        </head>
        <body>
          <img src="${imgData}" onload="window.print();">
        </body>
        </html>
      `);
      printWin.document.close();
    };

    /* -------------------------------------------------------------
       10. Initial Application Bootstrap & Hash Routing
       ------------------------------------------------------------- */
    const hash = window.location.hash.replace("#", "");
    if (hash === "journal" || hash === "puzzle") {
      updateHeader();
      initFilterOptions();
      render();
      setTimeout(() => openJournalModal(), 80);
    } else if (hash === "passport") {
      updateHeader();
      initFilterOptions();
      render();
      setTimeout(() => document.querySelector("#btn-open-passport").click(), 80);
    } else if (hash && window.COLLECTIONS[hash]) {
      switchSeries(hash);
    } else {
      updateHeader();
      initFilterOptions();
      render();
    }

    updatePassportBadge();
    updateJournalBadge();

    window.addEventListener("keydown", e => {
      const lb = document.querySelector("#lightbox");
      const pb = document.querySelector("#passport-lightbox");
      const eb = document.querySelector("#exlibris-lightbox");
      const jb = document.querySelector("#journal-lightbox");

      if (e.key === "Escape") {
        if (jb && jb.classList.contains("open")) jb.classList.remove("open");
        else if (eb.classList.contains("open")) eb.classList.remove("open");
        else if (pb.classList.contains("open")) pb.classList.remove("open");
        else if (lb.classList.contains("open")) lb.classList.remove("open");
      }
      if (lb && lb.classList.contains("open")) {
        if (e.key === "ArrowLeft") document.querySelector("#btn-prev").click();
        if (e.key === "ArrowRight") document.querySelector("#btn-next").click();
      }
    });
  </script>
</body>
</html>
