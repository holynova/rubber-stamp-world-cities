<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,viewport-fit=cover">
  <title>橡胶戳艺术印记 · 世界城市 / 十二生肖 / 二十四节气 / 爱经印契</title>
  <meta name="description" content="30座世界城市、十二生肖、二十四节气与爱经印契的复古手工橡胶戳印艺术画廊，支持声音盖章打卡、藏书票导出与多色系油墨切换。">

  <!-- Analytics -->
  <script
    defer
    src="https://cloud.umami.is/script.js"
    data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"
    data-domains="holynova.github.io,xiaosang.cc"
    data-exclude-search="true"
    data-exclude-hash="true"
  ></script>

  <style>
    :root {
      --paper: #eee5d5;
      --paper-card: #f8f1e5;
      --ink: #292722;
      --muted: #746d60;
      --line: #cfc2ad;
      --accent: #8d4d39;
      --tab-bg: #e6dac6;
      --card-bg: #ddd0bb;
      --seal-red: #b83b26;
      --seal-bg: #fff5eb;
    }
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-x: hidden;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif;
      background-image: radial-gradient(#7e6f5c18 .7px, transparent .7px);
      background-size: 7px 7px;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    /* Ink Palette Filters */
    .ink-cinnabar .stamp-img, .ink-cinnabar .modal-img-wrap img {
      filter: sepia(0.85) saturate(3.2) hue-rotate(-52deg) contrast(1.15);
    }
    .ink-indigo .stamp-img, .ink-indigo .modal-img-wrap img {
      filter: sepia(0.65) saturate(2.4) hue-rotate(168deg) contrast(1.1);
    }
    .ink-charcoal .stamp-img, .ink-charcoal .modal-img-wrap img {
      filter: grayscale(1) contrast(1.3) brightness(0.92);
    }
    .ink-moss .stamp-img, .ink-moss .modal-img-wrap img {
      filter: sepia(0.7) saturate(2.3) hue-rotate(58deg) contrast(1.1);
    }
    .ink-sepia .stamp-img, .ink-sepia .modal-img-wrap img {
      filter: sepia(1) saturate(1.8) hue-rotate(-22deg) contrast(1.1);
    }

    header {
      max-width: 1240px;
      width: 100%;
      margin: auto;
      padding: 42px 28px 20px;
      border-bottom: 1px solid var(--line);
    }
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
      min-width: 0;
    }
    .header-content {
      flex: 1;
      min-width: 0;
      width: 100%;
    }
    .kicker {
      font: 11.5px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--accent);
      transition: color .2s ease;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    h1 {
      font-size: clamp(26px, 4.8vw, 56px);
      line-height: 1.12;
      font-weight: 400;
      margin: 10px 0 12px;
      max-width: 800px;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    header p {
      max-width: 720px;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.65;
      margin: 0;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .header-actions {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .btn-top {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 8px 12px;
      color: var(--ink);
      text-decoration: none;
      font: 12.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .03em;
      transition: all .15s ease;
      box-shadow: 2px 2px 0 #c7b9a244;
      cursor: pointer;
      white-space: nowrap;
      min-height: 38px;
    }
    .btn-top:hover {
      background: #ede3d0;
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 3px 3px 0 #c7b9a288;
    }
    .btn-top:active {
      transform: translateY(1px);
      box-shadow: 1px 1px 0 #c7b9a244;
    }
    .btn-top-accent {
      background: #ede0cb;
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .passport-badge {
      background: var(--seal-red);
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 2px;
      line-height: 1;
    }

    /* Series Segmented Navigation */
    .series-nav-wrapper {
      max-width: 1240px;
      width: 100%;
      margin: auto;
      padding: 14px 28px 0;
      min-width: 0;
    }
    .series-nav {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      min-width: 0;
    }
    .series-nav::-webkit-scrollbar { display: none; }
    .series-tab {
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-family: inherit;
      transition: all .15s ease;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 38px;
      box-shadow: 1.5px 1.5px 0 #c7b9a233;
    }
    .series-tab:hover {
      color: var(--ink);
      background: #fff8ee;
      border-color: #bfae95;
    }
    .series-tab:active {
      transform: translateY(1px);
    }
    .series-tab.active {
      background: #ede0cb;
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
      box-shadow: inset 1px 1px 0 #8d4d3922, 1.5px 1.5px 0 #8d4d3933;
    }
    .tab-badge {
      font: 11px ui-monospace, monospace;
      padding: 2px 5px;
      background: #ddd1bd;
      border-radius: 2px;
      color: var(--ink);
      line-height: 1;
    }
    .series-tab.active .tab-badge {
      background: var(--accent);
      color: #fff;
    }
    .tab-title { font-size: 14.5px; }
    .tab-sub {
      font: 10.5px ui-monospace, monospace;
      opacity: .75;
      text-transform: uppercase;
    }

    /* Toolbar & Interactive Controls */
    .toolbar {
      max-width: 1240px;
      width: 100%;
      margin: auto;
      padding: 14px 28px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }
    .toolbar-search-row {
      display: flex;
      gap: 8px;
      flex: 1 1 300px;
      align-items: center;
      min-width: 0;
      width: 100%;
    }
    input, select {
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 8px 11px;
      color: var(--ink);
      font: 13px ui-monospace, monospace;
      outline: none;
      transition: border-color .15s ease;
      height: 36px;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    input {
      flex: 1;
      min-width: 110px;
    }
    select {
      flex-shrink: 0;
      cursor: pointer;
    }
    .ink-selector-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font: 12px ui-monospace, monospace;
      color: var(--muted);
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 2px 0;
      min-width: 0;
    }
    .ink-selector-wrap::-webkit-scrollbar { display: none; }
    .ink-label {
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ink-pill-group {
      display: flex;
      gap: 4px;
      background: #ede3d0;
      padding: 3px;
      border-radius: 4px;
      border: 1px solid var(--line);
      flex-shrink: 0;
    }
    .ink-pill {
      border: 0;
      background: transparent;
      padding: 4px 8px;
      border-radius: 3px;
      font: 11px ui-monospace, monospace;
      cursor: pointer;
      color: var(--muted);
      transition: all .15s ease;
      white-space: nowrap;
      min-height: 26px;
    }
    .ink-pill:hover { color: var(--ink); background: #fdfaf4; }
    .ink-pill.active {
      background: #f7f0e4;
      color: var(--ink);
      font-weight: 600;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    .count {
      margin-left: auto;
      color: var(--muted);
      font: 12px ui-monospace, monospace;
      white-space: nowrap;
    }

    /* Grid & Cards */
    .grid {
      max-width: 1240px;
      margin: auto;
      padding: 26px 28px 70px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 22px;
    }
    .card {
      position: relative;
      background: #f7f0e444;
      border-radius: 4px;
      transition: transform .18s ease;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .card:hover {
      transform: translateY(-3px);
    }
    .frame {
      position: relative;
      aspect-ratio: 4/5;
      background: var(--card-bg);
      border: 1px solid #c7b9a2;
      box-shadow: 3px 4px 0 #c7b9a244;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow .18s ease;
    }
    .card:hover .frame {
      box-shadow: 4px 6px 0 #c7b9a277;
    }
    .stamp-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform .25s ease, filter .2s ease;
    }
    .card:hover .stamp-img {
      transform: scale(1.02);
    }
    .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #eee5d5ee;
      border: 1px solid var(--line);
      padding: 2px 5px;
      font: 10px ui-monospace, monospace;
      letter-spacing: .03em;
      z-index: 2;
      border-radius: 2px;
    }
    
    /* Stamp Overlays */
    .stamped-seal {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px dashed var(--seal-red);
      color: var(--seal-red);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font: 8.5px/1.1 ui-monospace, monospace;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
      background: rgba(255, 246, 238, 0.92);
      box-shadow: inset 0 0 0 1px rgba(184, 59, 38, 0.25), 2px 2px 4px rgba(0,0,0,0.12);
      transform: rotate(-10deg);
      pointer-events: none;
      z-index: 3;
      animation: stampPop 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes stampPop {
      0% { transform: scale(2.4) rotate(18deg); opacity: 0; }
      70% { transform: scale(0.9) rotate(-12deg); opacity: 1; }
      100% { transform: scale(1) rotate(-10deg); opacity: 1; }
    }
    .seal-inner-char {
      font-size: 14px;
      font-family: "Songti SC", "Noto Serif CJK SC", serif;
      line-height: 1;
      margin-bottom: 2px;
    }

    .card-info {
      padding: 8px 2px 2px;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }
    .card h2 {
      font-size: 17px;
      font-weight: 500;
      margin: 0 0 3px;
      line-height: 1.25;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card h2:hover { color: var(--accent); }
    .meta {
      font: 11px/1.45 ui-monospace, monospace;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .keywords {
      color: var(--accent);
      font-size: 11.5px;
      line-height: 1.35;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    /* Card bottom action bar */
    .card-actions {
      display: flex;
      gap: 5px;
      margin-top: auto;
      padding-top: 5px;
      border-top: 1px dashed var(--line);
    }
    .btn-card-action {
      flex: 1;
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 5px 4px;
      font: 11px ui-monospace, monospace;
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all .15s ease;
      white-space: nowrap;
      min-height: 30px;
      min-width: 0;
    }
    .btn-card-action:hover {
      background: #ede0cb;
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-card-action:active {
      transform: scale(0.97);
    }
    .btn-card-stamp.stamped {
      background: #fbeee8;
      border-color: var(--seal-red);
      color: var(--seal-red);
      font-weight: 600;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 15px;
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      background: #211f1bdd;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
      backdrop-filter: blur(4px);
    }
    .lightbox.open { display: flex; }
    .modal {
      max-width: 940px;
      width: 100%;
      max-height: 92vh;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(260px, .8fr);
      background: var(--paper);
      padding: 18px;
      gap: 20px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 40px rgba(0,0,0,.35);
      position: relative;
      border-radius: 4px;
    }
    .modal-img-wrap {
      position: relative;
      background: var(--card-bg);
      border: 1px solid #c7b9a2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 2px;
    }
    .modal img {
      width: 100%;
      height: 100%;
      max-height: 82vh;
      object-fit: contain;
      display: block;
      transition: filter .2s ease;
    }
    .modal aside {
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .modal-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .modal h2 {
      font-size: 28px;
      font-weight: 400;
      margin: 0 0 10px;
      line-height: 1.15;
    }
    .close {
      border: 0;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
      padding: 0 6px;
      min-width: 36px;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .close:hover { color: var(--accent); background: rgba(0,0,0,0.04); }
    .modal-meta {
      font: 12px/1.55 ui-monospace, monospace;
      color: var(--muted);
      margin-bottom: 10px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }
    .modal-keywords {
      color: var(--accent);
      font-size: 13.5px;
      margin-bottom: 8px;
    }
    .modal-colors {
      font: 11px ui-monospace, monospace;
      color: var(--muted);
      margin-bottom: 12px;
    }
    
    .modal-interactive-btns {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .btn-modal-action {
      flex: 1;
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 9px 10px;
      font: 12.5px ui-monospace, monospace;
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all .15s ease;
      min-height: 38px;
    }
    .btn-modal-action:hover {
      background: #ede0cb;
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-modal-stamp.stamped {
      background: #fbeee8;
      border-color: var(--seal-red);
      color: var(--seal-red);
      font-weight: 600;
    }
    .btn-modal-exlibris {
      background: #e8ede3;
      border-color: #8fa389;
      color: #3b5a3f;
    }
    .btn-modal-exlibris:hover {
      background: #dbe4d5;
      border-color: #3b5a3f;
      color: #2b452f;
    }

    .modal-nav-btns {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .modal-btn {
      flex: 1;
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 7px 10px;
      font: 12px ui-monospace, monospace;
      cursor: pointer;
      color: var(--ink);
      text-align: center;
      min-height: 34px;
    }
    .modal-btn:hover {
      background: #eee0cc;
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Modal 2: Stamp Passport Modal */
    .passport-modal-inner {
      max-width: 980px;
      width: 100%;
      max-height: 92vh;
      background: var(--paper);
      padding: 22px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 40px rgba(0,0,0,.35);
      display: flex;
      flex-direction: column;
      position: relative;
      border-radius: 4px;
    }
    .passport-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }
    .passport-title {
      font-size: 26px;
      font-weight: 400;
      margin: 0 0 4px;
    }
    .passport-stats {
      font: 12.5px ui-monospace, monospace;
      color: var(--muted);
    }
    .passport-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .passport-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      overflow-y: auto;
      max-height: 52vh;
      padding: 8px;
      background: #fdfaf4;
      border: 1px solid var(--line);
      border-radius: 3px;
    }
    .passport-item {
      position: relative;
      aspect-ratio: 4/5;
      background: var(--card-bg);
      border: 1px solid #c7b9a2;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 2px 3px 0 #c7b9a244;
      cursor: pointer;
      transition: transform .15s ease;
    }
    .passport-item:hover { transform: scale(1.03); }
    .passport-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .passport-item-title {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(247, 240, 228, 0.92);
      font: 10px/1.2 ui-monospace, monospace;
      text-align: center;
      padding: 3px 2px;
      border-top: 1px solid var(--line);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal 3: Ex-Libris Generator Modal */
    .exlibris-modal-inner {
      max-width: 960px;
      width: 100%;
      max-height: 94vh;
      background: var(--paper);
      padding: 22px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 40px rgba(0,0,0,.35);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      position: relative;
      overflow-y: auto;
      border-radius: 4px;
    }
    .exlibris-preview-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #312e2b;
      padding: 14px;
      border-radius: 4px;
      border: 1px solid #4a4540;
    }
    #exlibris-canvas {
      max-width: 100%;
      max-height: 62vh;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      background: #f4ecdc;
    }
    .exlibris-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label {

  <script>
    /* -------------------------------------------------------------
       1. Web Audio API Tactile Stamp Press Synthesizer
       ------------------------------------------------------------- */
    let audioCtx = null;
    function playStampSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        const t = audioCtx.currentTime;

        // 1. Low Thump (Rubber cushion hitting thick deckle paper)
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(32, t + 0.075);
        oscGain.gain.setValueAtTime(0.75, t);
        oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.08);

        // 2. High Mechanical Click (Handle pressure transient)
        const clickOsc = audioCtx.createOscillator();
        const clickGain = audioCtx.createGain();
        clickOsc.type = "triangle";
        clickOsc.frequency.setValueAtTime(880, t);
        clickOsc.frequency.exponentialRampToValueAtTime(90, t + 0.02);
        clickGain.gain.setValueAtTime(0.4, t);
        clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
        clickOsc.connect(clickGain);
        clickGain.connect(audioCtx.destination);
        clickOsc.start(t);
        clickOsc.stop(t + 0.02);

        // 3. Tactile Paper Friction Burst
        const bufferSize = Math.floor(audioCtx.sampleRate * 0.04);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(550, t);
        filter.Q.setValueAtTime(1.5, t);
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.3, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start(t);
        noise.stop(t + 0.035);
      } catch (err) {
        console.warn("Audio unavailable", err);
      }
    }

    function initMobileAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      } catch (e) {}
    }
    window.addEventListener("touchstart", initMobileAudio, { once: true, passive: true });
    window.addEventListener("pointerdown", initMobileAudio, { once: true, passive: true });

    /* -------------------------------------------------------------
       2. State & Storage Management
       ------------------------------------------------------------- */
    const STORAGE_KEY = "rubber_stamp_passport_v2";
    let collectedMap = {};
    try {
      collectedMap = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    } catch (e) {
      collectedMap = {};
    }

    function saveCollected() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(collectedMap));
      } catch (e) {}
      updatePassportBadge();
    }

    function isStamped(seriesKey, id) {
      return !!collectedMap[`${seriesKey}_${id}`];
    }

    function toggleStamp(seriesKey, id) {
      const key = `${seriesKey}_${id}`;
      if (collectedMap[key]) {
        delete collectedMap[key];
      } else {
        collectedMap[key] = {
          time: new Date().toISOString(),
          dateStr: new Date().toLocaleDateString("zh-CN")
        };
        playStampSound();
      }
      saveCollected();
      render();
      if (document.querySelector("#lightbox").classList.contains("open")) {
        updateModalStampBtn();
      }
    }

    function getTotalCollectedCount() {
      return Object.keys(collectedMap).length;
    }

    function updatePassportBadge() {
      const count = getTotalCollectedCount();
      document.querySelector("#passport-count-badge").textContent = count;
    }

    /* -------------------------------------------------------------
       3. Ink Palette Management
       ------------------------------------------------------------- */
    let currentInk = "original";
    const inkPills = document.querySelectorAll(".ink-pill");
    inkPills.forEach(pill => {
      pill.addEventListener("click", () => {
        setInkPalette(pill.dataset.ink);
      });
    });

    function setInkPalette(inkName) {
      currentInk = inkName;
      inkPills.forEach(p => p.classList.toggle("active", p.dataset.ink === inkName));
      document.body.className = inkName === "original" ? "" : `ink-${inkName}`;
    }

    /* -------------------------------------------------------------
       4. Gallery Navigation & Rendering
       ------------------------------------------------------------- */
    let currentSeriesKey = "cities";
    let currentModalIndex = 0;
    let currentFilteredRows = [];

    const grid = document.querySelector("#grid");
    const search = document.querySelector("#search");
    const filter = document.querySelector("#filter");
    const count = document.querySelector("#count");
    const heroKicker = document.querySelector("#hero-kicker");
    const heroTitle = document.querySelector("#hero-title");
    const heroDesc = document.querySelector("#hero-desc");
    const tabs = document.querySelectorAll(".series-tab");

    function getCollection() {
      return window.COLLECTIONS[currentSeriesKey] || window.COLLECTIONS.cities;
    }

    function initFilterOptions() {
      if (currentSeriesKey === "solar_terms") {
        filter.style.display = "";
        filter.innerHTML = `
          <option value="all">全部节气 (24)</option>
          <option value="season-春">春季物候 (6)</option>
          <option value="season-夏">夏季物候 (6)</option>
          <option value="season-秋">秋季物候 (6)</option>
          <option value="season-冬">冬季物候 (6)</option>
        `;
      } else if (currentSeriesKey === "kama_sutra") {
        filter.style.display = "";
        filter.innerHTML = `
          <option value="all">全部爱经印契 (10)</option>
        `;
      } else if (currentSeriesKey === "zodiac") {
        filter.style.display = "";
        filter.innerHTML = `
          <option value="all">全部生肖瑞兽 (12)</option>
        `;
      } else {
        filter.style.display = "";
        filter.innerHTML = `
          <option value="all">全部世界城市 (30)</option>
        `;
      }
    }

    function updateHeader() {
      const col = getCollection();
      heroKicker.textContent = col.kicker;
      heroTitle.innerHTML = col.headline;
      heroDesc.textContent = col.desc;
      document.title = `${col.title} · 橡胶戳艺术印记`;
    }

    function render() {
      const col = getCollection();
      const q = search.value.trim().toLowerCase();
      const f = filter.value;

      currentFilteredRows = col.items.filter(x => {
        const titleStr = (x.city || x.title || x.name || "") + " " + (x.animal || "") + " " + (x.season || "");
        const textToMatch = (titleStr + " " + (x.features || "") + " " + (x.keywords || []).join(" ")).toLowerCase();
        const matchesQuery = !q || textToMatch.includes(q);
        
        let matchesFilter = true;
        if (f && f.startsWith("season-")) matchesFilter = (x.season === f.replace("season-", ""));

        return matchesQuery && matchesFilter;
      });

      count.textContent = `${currentFilteredRows.length} / ${col.items.length} ${col.title}`;

      if (!currentFilteredRows.length) {
        grid.innerHTML = '<div class="empty">没有找到匹配的橡胶戳印记。</div>';
        return;
      }

      grid.innerHTML = currentFilteredRows.map((x, idx) => {
        const displayName = x.city || x.title || x.name;
        const badgeLabel = col.badgeFormat ? col.badgeFormat.replace("{id}", String(x.id).padStart(2, "0")) : `NO. ${String(x.id).padStart(2, "0")}`;
        const stamped = isStamped(currentSeriesKey, x.id);

        return `
          <article class="card" data-id="${x.id}" data-index="${idx}">
            <div class="frame" onclick="openModal(${idx})">
              <img class="stamp-img" src="${x.output}" alt="${displayName} 橡胶戳海报" onerror="this.src='placeholder.svg'">
              <span class="badge">${badgeLabel}</span>
              ${stamped ? `
                <div class="stamped-seal">
                  <span class="seal-inner-char">印</span>
                  <span>COLLECTED</span>
                </div>
              ` : ""}
            </div>
            <div class="card-info">
              <h2 onclick="openModal(${idx})">${displayName}</h2>
              <div class="meta">${x.features || ""}</div>
              <div class="keywords">${(x.keywords || []).join(" · ")}</div>
              <div class="card-actions">
                <button class="btn-card-action btn-card-stamp ${stamped ? "stamped" : ""}" onclick="toggleStamp('${currentSeriesKey}', ${x.id})">
                  ${stamped ? "✓ 已盖印" : "🏷️ 盖章"}
                </button>
                <button class="btn-card-action" onclick="openExLibrisFor(${idx})">
                  🔖 藏书票
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function switchSeries(key) {
      if (currentSeriesKey === key) return;
      currentSeriesKey = key;
      tabs.forEach(t => {
        const isAct = t.dataset.series === key;
        t.classList.toggle("active", isAct);
        if (isAct) {
          try {
            t.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
          } catch(e) {}
        }
      });
      window.location.hash = key;
      updateHeader();
      initFilterOptions();
      search.value = "";
      render();
    }

    tabs.forEach(t => {
      t.addEventListener("click", () => switchSeries(t.dataset.series));
    });

    const hash = window.location.hash.replace("#", "");
    if (hash && window.COLLECTIONS[hash]) {
      switchSeries(hash);
    } else {
      updateHeader();
      initFilterOptions();
      render();
    }

    search.oninput = render;
    filter.onchange = render;
    updatePassportBadge();

    /* -------------------------------------------------------------
       5. Lightbox Modal
       ------------------------------------------------------------- */
    function updateModalStampBtn() {
      if (currentModalIndex < 0 || currentModalIndex >= currentFilteredRows.length) return;
      const x = currentFilteredRows[currentModalIndex];
      const stamped = isStamped(currentSeriesKey, x.id);
      const btn = document.querySelector("#modal-stamp-btn");
      btn.className = `btn-modal-action btn-modal-stamp ${stamped ? "stamped" : ""}`;
      btn.innerHTML = stamped ? "<span>✓ 已盖入收集册</span>" : "<span>🏷️ 盖入收集册</span>";
    }

    function openModal(index) {
      if (index < 0 || index >= currentFilteredRows.length) return;
      currentModalIndex = index;
      const x = currentFilteredRows[index];
      const col = getCollection();
      const displayName = x.city || x.title || x.name;

      document.querySelector("#big").src = x.output;
      document.querySelector("#big").alt = displayName;
      document.querySelector("#number").textContent = `${col.titleEn.toUpperCase()} ${String(x.id).padStart(2, "0")} / ${col.items.length}`;
      document.querySelector("#title").textContent = displayName;
      document.querySelector("#details").textContent = x.features || "";
      document.querySelector("#desc").textContent = (x.keywords || []).join(" · ");
      document.querySelector("#colors-info").textContent = x.colors ? `印层配色：${x.colors}` : "";
      
      updateModalStampBtn();
      document.querySelector("#lightbox").classList.add("open");
    }

    document.querySelector("#modal-stamp-btn").onclick = () => {
      const x = currentFilteredRows[currentModalIndex];
      toggleStamp(currentSeriesKey, x.id);
    };

    document.querySelector("#modal-exlibris-btn").onclick = () => {
      document.querySelector("#lightbox").classList.remove("open");
      openExLibrisFor(currentModalIndex);
    };

    document.querySelector("#close").onclick = () => document.querySelector("#lightbox").classList.remove("open");
    document.querySelector("#lightbox").onclick = e => {
      if (e.target.id === "lightbox") e.currentTarget.classList.remove("open");
    };

    document.querySelector("#btn-prev").onclick = () => {
      if (currentModalIndex > 0) openModal(currentModalIndex - 1);
      else openModal(currentFilteredRows.length - 1);
    };

    document.querySelector("#btn-next").onclick = () => {
      if (currentModalIndex < currentFilteredRows.length - 1) openModal(currentModalIndex + 1);
      else openModal(0);
    };

    // Keyboard Arrow Navigation
    window.addEventListener("keydown", e => {
      if (!document.querySelector("#lightbox").classList.contains("open")) return;
      if (e.key === "Escape") document.querySelector("#lightbox").classList.remove("open");
      else if (e.key === "ArrowLeft") document.querySelector("#btn-prev").click();
      else if (e.key === "ArrowRight") document.querySelector("#btn-next").click();
    });

    // Mobile Touch Swipe Gesture Support
    let touchStartX = 0;
    let touchStartY = 0;
    const lightboxEl = document.querySelector("#lightbox");
    lightboxEl.addEventListener("touchstart", e => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    lightboxEl.addEventListener("touchend", e => {
      if (e.changedTouches.length === 1) {
        const diffX = e.changedTouches[0].clientX - touchStartX;
        const diffY = e.changedTouches[0].clientY - touchStartY;
        // Horizontal swipe gesture threshold
        if (Math.abs(diffX) > 40 && Math.abs(diffY) < 65) {
          if (diffX < 0) {
            document.querySelector("#btn-next").click();
          } else {
            document.querySelector("#btn-prev").click();
          }
        }
      }
    }, { passive: true });

    /* -------------------------------------------------------------
       6. Stamp Passport Modal & Postcard Canvas Exporter
       ------------------------------------------------------------- */
    const passportLightbox = document.querySelector("#passport-lightbox");
    document.querySelector("#btn-open-passport").onclick = openPassportModal;
    document.querySelector("#passport-close").onclick = () => passportLightbox.classList.remove("open");
    passportLightbox.onclick = e => {
      if (e.target.id === "passport-lightbox") passportLightbox.classList.remove("open");
    };

    function openPassportModal() {
      renderPassportGrid();
      passportLightbox.classList.add("open");
    }

    function renderPassportGrid() {
      const pGrid = document.querySelector("#passport-grid");
      const totalCount = getTotalCollectedCount();
      document.querySelector("#passport-stats-text").textContent = `已盖章收集 ${totalCount} 枚印记`;

      const collectedKeys = Object.keys(collectedMap);
      if (!collectedKeys.length) {
        pGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted);">您的收集册还是空的。在画廊中点击任意印章下方的【盖章】即可在此收录！</div>`;
        return;
      }

      pGrid.innerHTML = collectedKeys.map(key => {
        const [sKey, idStr] = key.split("_");
        const id = parseInt(idStr, 10);
        const col = window.COLLECTIONS[sKey];
        if (!col) return "";
        const item = col.items.find(x => x.id === id);
        if (!item) return "";
        const displayName = item.city || item.title || item.name;

        return `
          <div class="passport-item" onclick="switchSeries('${sKey}'); passportLightbox.classList.remove('open');">
            <img class="stamp-img" src="${item.output}" alt="${displayName}">
            <div class="passport-item-title">${displayName}</div>
          </div>
        `;
      }).join("");
    }

    document.querySelector("#btn-stamp-all").onclick = () => {
      Object.keys(window.COLLECTIONS).forEach(sKey => {
        window.COLLECTIONS[sKey].items.forEach(x => {
          collectedMap[`${sKey}_${x.id}`] = {
            time: new Date().toISOString(),
            dateStr: new Date().toLocaleDateString("zh-CN")
          };
        });
      });
      playStampSound();
      saveCollected();
      render();
      renderPassportGrid();
    };

    document.querySelector("#btn-reset-passport").onclick = () => {
      if (confirm("确定要清空所有已收集的印章记录吗？")) {
        collectedMap = {};
        saveCollected();
        render();
        renderPassportGrid();
      }
    };

    // Canvas Postcard Exporter
    document.querySelector("#btn-export-postcard").onclick = () => {
      const keys = Object.keys(collectedMap);
      if (!keys.length) {
        alert("收集册中还没有印章，请先在画廊中点击【盖章】收集！");
        return;
      }

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const w = 1200;
      const h = 800;
      canvas.width = w;
      canvas.height = h;

      // Draw postcard paper
      ctx.fillStyle = "#f5eddc";
      ctx.fillRect(0, 0, w, h);

      // Postcard deckle border
      ctx.strokeStyle = "#cfc2ad";
      ctx.lineWidth = 4;
      ctx.strokeRect(20, 20, w - 40, h - 40);

      ctx.strokeStyle = "#b83b26";
      ctx.lineWidth = 1;
      ctx.strokeRect(28, 28, w - 56, h - 56);

      // Postcard Airmail top stripes
      ctx.fillStyle = "#8d4d39";
      ctx.font = "bold 26px Georgia, serif";
      ctx.fillText("RUBBER STAMP TRAVEL PASSPORT", 50, 75);

      ctx.fillStyle = "#746d60";
      ctx.font = "14px ui-monospace, monospace";
      ctx.fillText("OFFICIAL TRAVEL FIELD-NOTE ARCHIVE • COLLECTOR'S SHEET", 50, 100);

      // Postmark stamp circle
      ctx.save();
      ctx.translate(w - 140, 100);
      ctx.rotate(-0.15);
      ctx.strokeStyle = "#b83b26";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 48, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "#b83b26";
      ctx.font = "bold 9px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText("RUBBER STAMP ARCHIVE", 0, -22);
      ctx.font = "bold 13px ui-monospace, monospace";
      ctx.fillText(new Date().toISOString().slice(0, 10), 0, 4);
      ctx.font = "bold 9px ui-monospace, monospace";
      ctx.fillText("★ CERTIFIED ★", 0, 26);
      ctx.restore();

      // Draw collected stamps collage
      const maxStamps = Math.min(keys.length, 12);
      const cols = 6;
      const rows = 2;
      const stampW = 145;
      const stampH = 180;
      const startX = 60;
      const startY = 160;
      const gapX = 35;
      const gapY = 40;

      let loadedImages = 0;
      const itemsToDraw = [];

      for (let i = 0; i < maxStamps; i++) {
        const [sKey, idStr] = keys[i].split("_");
        const col = window.COLLECTIONS[sKey];
        if (!col) continue;
        const item = col.items.find(x => x.id === parseInt(idStr, 10));
        if (item) itemsToDraw.push({ item, sKey });
      }

      if (!itemsToDraw.length) return;

      itemsToDraw.forEach((entry, idx) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = entry.item.output;
        img.onload = () => {
          loadedImages++;
          const colIdx = idx % cols;
          const rowIdx = Math.floor(idx / cols);
          const x = startX + colIdx * (stampW + gapX);
          const y = startY + rowIdx * (stampH + gapY);

          // Stamp frame
          ctx.save();
          ctx.fillStyle = "#ebdcc7";
          ctx.fillRect(x - 6, y - 6, stampW + 12, stampH + 30);
          ctx.strokeStyle = "#c2b39c";
          ctx.lineWidth = 1;
          ctx.strokeRect(x - 6, y - 6, stampW + 12, stampH + 30);

          // Apply current ink filter if needed
          if (currentInk === "cinnabar") ctx.filter = "sepia(0.85) saturate(3.2) hue-rotate(-52deg)";
          else if (currentInk === "indigo") ctx.filter = "sepia(0.65) saturate(2.4) hue-rotate(168deg)";
          else if (currentInk === "charcoal") ctx.filter = "grayscale(1)";
          else if (currentInk === "moss") ctx.filter = "sepia(0.7) saturate(2.3) hue-rotate(58deg)";
          else if (currentInk === "sepia") ctx.filter = "sepia(1) saturate(1.8) hue-rotate(-22deg)";

          ctx.drawImage(img, x, y, stampW, stampH);
          ctx.restore();

          // Title
          ctx.fillStyle = "#292722";
          ctx.font = "12px 'Songti SC', serif";
          ctx.textAlign = "center";
          const title = entry.item.city || entry.item.title || entry.item.name;
          ctx.fillText(title, x + stampW / 2, y + stampH + 16);

          if (loadedImages === itemsToDraw.length) {
            // Footer text
            ctx.fillStyle = "#746d60";
            ctx.font = "12px ui-monospace, monospace";
            ctx.textAlign = "left";
            ctx.fillText(`TOTAL COLLECTED: ${keys.length} STAMPS • CREATED ON XIAOSANG.CC`, 50, h - 45);

            // Download
            const link = document.createElement("a");
            link.download = `Stamp_Passport_Postcard_${new Date().toISOString().slice(0,10)}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
          }
        };
        img.onerror = () => {
          loadedImages++;
        };
      });
    };

    /* -------------------------------------------------------------
       7. Ex-Libris Custom Bookplate Studio
       ------------------------------------------------------------- */
    const exlibrisLightbox = document.querySelector("#exlibris-lightbox");
    const exCanvas = document.querySelector("#exlibris-canvas");
    const exCtx = exCanvas.getContext("2d");
    let exlibrisTargetItem = null;

    document.querySelector("#exlibris-close").onclick = () => exlibrisLightbox.classList.remove("open");
    exlibrisLightbox.onclick = e => {
      if (e.target.id === "exlibris-lightbox") exlibrisLightbox.classList.remove("open");
    };

    function openExLibrisFor(index) {
      if (index < 0 || index >= currentFilteredRows.length) return;
      exlibrisTargetItem = currentFilteredRows[index];
      exlibrisLightbox.classList.add("open");
      drawExLibris();
    }

    const exInputs = ["#ex-owner", "#ex-motto", "#ex-border", "#ex-paper", "#ex-ink"];
    exInputs.forEach(sel => {
      document.querySelector(sel).oninput = () => drawExLibris();
      document.querySelector(sel).onchange = () => drawExLibris();
    });

    function drawExLibris(exportMode = false) {
      if (!exlibrisTargetItem) return;

      const cw = exportMode ? 1200 : 600;
      const ch = exportMode ? 1600 : 800;
      const scale = exportMode ? 2 : 1;

      exCanvas.width = cw;
      exCanvas.height = ch;

      const owner = document.querySelector("#ex-owner").value.trim() || "HOLY NOVA";
      const motto = document.querySelector("#ex-motto").value;
      const borderStyle = document.querySelector("#ex-border").value;
      const paperColor = document.querySelector("#ex-paper").value;
      const inkSetting = document.querySelector("#ex-ink").value;

      // 1. Paper Background
      exCtx.fillStyle = paperColor;
      exCtx.fillRect(0, 0, cw, ch);

      // Subtle paper texture speckles
      exCtx.fillStyle = "rgba(100, 80, 60, 0.03)";
      for (let i = 0; i < 800 * scale; i++) {
        exCtx.fillRect(Math.random() * cw, Math.random() * ch, 1.5, 1.5);
      }

      // 2. Borders
      const margin = 28 * scale;
      exCtx.strokeStyle = "#292722";
      if (borderStyle === "classical") {
        exCtx.lineWidth = 3 * scale;
        exCtx.strokeRect(margin, margin, cw - margin * 2, ch - margin * 2);
        exCtx.lineWidth = 1 * scale;
        exCtx.strokeRect(margin + 6 * scale, margin + 6 * scale, cw - (margin + 6 * scale) * 2, ch - (margin + 6 * scale) * 2);
        
        // Corner rosettes
        const cs = 14 * scale;
        [
          [margin, margin], [cw - margin, margin],
          [margin, ch - margin], [cw - margin, ch - margin]
        ].forEach(([cx, cy]) => {
          exCtx.fillStyle = "#b83b26";
          exCtx.fillRect(cx - cs / 2, cy - cs / 2, cs, cs);
        });
      } else if (borderStyle === "oriental") {
        exCtx.lineWidth = 4 * scale;
        exCtx.strokeRect(margin, margin, cw - margin * 2, ch - margin * 2);
        exCtx.strokeStyle = "#b83b26";
        exCtx.lineWidth = 1.5 * scale;
        exCtx.strokeRect(margin + 8 * scale, margin + 8 * scale, cw - (margin + 8 * scale) * 2, ch - (margin + 8 * scale) * 2);
      } else {
        exCtx.lineWidth = 1.5 * scale;
        exCtx.strokeRect(margin, margin, cw - margin * 2, ch - margin * 2);
      }

      // 3. Top Motto (EX LIBRIS)
      exCtx.fillStyle = "#8d4d39";
      exCtx.font = `bold ${28 * scale}px Georgia, serif`;
      exCtx.textAlign = "center";
      exCtx.fillText(motto, cw / 2, 85 * scale);

      // 4. Center Stamp Artwork
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = exlibrisTargetItem.output;
      img.onload = () => {
        const stampW = 360 * scale;
        const stampH = 450 * scale;
        const stampX = (cw - stampW) / 2;
        const stampY = 120 * scale;

        exCtx.save();
        // Inner photo mount frame
        exCtx.fillStyle = "#ebdcc7";
        exCtx.fillRect(stampX - 8 * scale, stampY - 8 * scale, stampW + 16 * scale, stampH + 16 * scale);
        exCtx.strokeStyle = "#cfc2ad";
        exCtx.lineWidth = 1 * scale;
        exCtx.strokeRect(stampX - 8 * scale, stampY - 8 * scale, stampW + 16 * scale, stampH + 16 * scale);

        // Apply Ink Filter to Canvas
        let effectiveInk = inkSetting === "current" ? currentInk : inkSetting;
        if (effectiveInk === "cinnabar") exCtx.filter = "sepia(0.85) saturate(3.2) hue-rotate(-52deg)";
        else if (effectiveInk === "indigo") exCtx.filter = "sepia(0.65) saturate(2.4) hue-rotate(168deg)";
        else if (effectiveInk === "charcoal") exCtx.filter = "grayscale(1)";
        else if (effectiveInk === "moss") exCtx.filter = "sepia(0.7) saturate(2.3) hue-rotate(58deg)";
        else if (effectiveInk === "sepia") exCtx.filter = "sepia(1) saturate(1.8) hue-rotate(-22deg)";

        exCtx.drawImage(img, stampX, stampY, stampW, stampH);
        exCtx.restore();

        // 5. Subject Title Banner
        const displayName = exlibrisTargetItem.city || exlibrisTargetItem.title || exlibrisTargetItem.name;
        exCtx.fillStyle = "#292722";
        exCtx.font = `${18 * scale}px "Songti SC", Georgia, serif`;
        exCtx.textAlign = "center";
        exCtx.fillText(`— ${displayName} —`, cw / 2, 620 * scale);

        // 6. Owner Name Box
        const boxY = 660 * scale;
        const boxW = 380 * scale;
        const boxH = 55 * scale;
        const boxX = (cw - boxW) / 2;

        exCtx.fillStyle = "#fffaf2";
        exCtx.fillRect(boxX, boxY, boxW, boxH);
        exCtx.strokeStyle = "#8d4d39";
        exCtx.lineWidth = 1.5 * scale;
        exCtx.strokeRect(boxX, boxY, boxW, boxH);

        exCtx.fillStyle = "#8d4d39";
        exCtx.font = `bold ${20 * scale}px "Songti SC", Georgia, serif`;
        exCtx.textAlign = "center";
        exCtx.fillText(owner, cw / 2, boxY + 36 * scale);

        // 7. Micro footer
        exCtx.fillStyle = "#746d60";
        exCtx.font = `${11 * scale}px ui-monospace, monospace`;
        exCtx.fillText("RUBBER STAMP EX-LIBRIS • EDITION 2026", cw / 2, ch - 40 * scale);
      };
    }

    document.querySelector("#btn-download-exlibris").onclick = () => {
      const exportCanvas = document.createElement("canvas");
      exportCanvas.width = 1200;
      exportCanvas.height = 1600;
      const exportCtx = exportCanvas.getContext("2d");

      const owner = document.querySelector("#ex-owner").value.trim() || "HOLY NOVA";
      const motto = document.querySelector("#ex-motto").value;
      const borderStyle = document.querySelector("#ex-border").value;
      const paperColor = document.querySelector("#ex-paper").value;
      const inkSetting = document.querySelector("#ex-ink").value;
      const scale = 2;

      exportCtx.fillStyle = paperColor;
      exportCtx.fillRect(0, 0, 1200, 1600);

      const margin = 28 * scale;
      exportCtx.strokeStyle = "#292722";
      if (borderStyle === "classical") {
        exportCtx.lineWidth = 3 * scale;
        exportCtx.strokeRect(margin, margin, 1200 - margin * 2, 1600 - margin * 2);
        exportCtx.lineWidth = 1 * scale;
        exportCtx.strokeRect(margin + 6 * scale, margin + 6 * scale, 1200 - (margin + 6 * scale) * 2, 1600 - (margin + 6 * scale) * 2);
      } else {
        exportCtx.lineWidth = 2 * scale;
        exportCtx.strokeRect(margin, margin, 1200 - margin * 2, 1600 - margin * 2);
      }

      exportCtx.fillStyle = "#8d4d39";
      exportCtx.font = "bold 56px Georgia, serif";
      exportCtx.textAlign = "center";
      exportCtx.fillText(motto, 600, 170);

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = exlibrisTargetItem.output;
      img.onload = () => {
        const stampW = 720;
        const stampH = 900;
        const stampX = (1200 - stampW) / 2;
        const stampY = 240;

        exportCtx.save();
        exportCtx.fillStyle = "#ebdcc7";
        exportCtx.fillRect(stampX - 16, stampY - 16, stampW + 32, stampH + 32);
        exportCtx.strokeStyle = "#cfc2ad";
        exportCtx.strokeRect(stampX - 16, stampY - 16, stampW + 32, stampH + 32);

        let effectiveInk = inkSetting === "current" ? currentInk : inkSetting;
        if (effectiveInk === "cinnabar") exportCtx.filter = "sepia(0.85) saturate(3.2) hue-rotate(-52deg)";
        else if (effectiveInk === "indigo") exportCtx.filter = "sepia(0.65) saturate(2.4) hue-rotate(168deg)";
        else if (effectiveInk === "charcoal") exportCtx.filter = "grayscale(1)";
        else if (effectiveInk === "moss") exportCtx.filter = "sepia(0.7) saturate(2.3) hue-rotate(58deg)";
        else if (effectiveInk === "sepia") exportCtx.filter = "sepia(1) saturate(1.8) hue-rotate(-22deg)";

        exportCtx.drawImage(img, stampX, stampY, stampW, stampH);
        exportCtx.restore();

        const displayName = exlibrisTargetItem.city || exlibrisTargetItem.title || exlibrisTargetItem.name;
        exportCtx.fillStyle = "#292722";
        exportCtx.font = "36px 'Songti SC', Georgia, serif";
        exportCtx.textAlign = "center";
        exportCtx.fillText(`— ${displayName} —`, 600, 1240);

        const boxY = 1320;
        const boxW = 760;
        const boxH = 110;
        const boxX = (1200 - boxW) / 2;

        exportCtx.fillStyle = "#fffaf2";
        exportCtx.fillRect(boxX, boxY, boxW, boxH);
        exportCtx.strokeStyle = "#8d4d39";
        exportCtx.lineWidth = 3;
        exportCtx.strokeRect(boxX, boxY, boxW, boxH);

        exportCtx.fillStyle = "#8d4d39";
        exportCtx.font = "bold 42px 'Songti SC', Georgia, serif";
        exportCtx.fillText(owner, 600, boxY + 70);

        exportCtx.fillStyle = "#746d60";
        exportCtx.font = "22px ui-monospace, monospace";
        exportCtx.fillText("RUBBER STAMP EX-LIBRIS • EDITION 2026", 600, 1530);

        const link = document.createElement("a");
        link.download = `ExLibris_${owner}_${displayName}.png`;
        link.href = exportCanvas.toDataURL("image/png");
        link.click();
      };
    };

    window.addEventListener("keydown", e => {
      const lb = document.querySelector("#lightbox");
      const pb = document.querySelector("#passport-lightbox");
      const eb = document.querySelector("#exlibris-lightbox");

      if (e.key === "Escape") {
        if (eb.classList.contains("open")) eb.classList.remove("open");
        else if (pb.classList.contains("open")) pb.classList.remove("open");
        else if (lb.classList.contains("open")) lb.classList.remove("open");
      }
      if (lb.classList.contains("open")) {
        if (e.key === "ArrowLeft") document.querySelector("#btn-prev").click();
        if (e.key === "ArrowRight") document.querySelector("#btn-next").click();
      }
    });
  </script>
</body>
</html>
