<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>橡胶戳艺术印记 · 世界城市 / 十二生肖 / 二十四节气</title>
  <meta name="description" content="30座世界城市、十二生肖与二十四节气的复古手工橡胶戳印艺术画廊。">

  <!-- Analytics -->
  <script
    defer
    src="https://cloud.umami.is/script.js"
    data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"
    data-domains="holynova.github.io"
    data-exclude-search="true"
    data-exclude-hash="true"
  ></script>

  <style>
    :root {
      --paper: #eee5d5;
      --ink: #292722;
      --muted: #746d60;
      --line: #cfc2ad;
      --accent: #8d4d39;
      --tab-bg: #e6dac6;
      --card-bg: #ddd0bb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif;
      background-image: radial-gradient(#7e6f5c18 .7px, transparent .7px);
      background-size: 7px 7px;
      -webkit-font-smoothing: antialiased;
    }
    header {
      max-width: 1240px;
      margin: auto;
      padding: 56px 28px 24px;
      border-bottom: 1px solid var(--line);
    }
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
    }
    .header-content { flex: 1; }
    .kicker {
      font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--accent);
      transition: color .2s ease;
    }
    h1 {
      font-size: clamp(34px, 5.5vw, 68px);
      line-height: 1.05;
      font-weight: 400;
      margin: 14px 0 16px;
      max-width: 800px;
    }
    header p {
      max-width: 680px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      margin: 0;
    }
    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 8px 14px;
      color: var(--ink);
      text-decoration: none;
      font: 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .05em;
      transition: all .15s ease;
      box-shadow: 2px 2px 0 #c7b9a244;
      flex-shrink: 0;
    }
    .github-link:hover {
      background: #ede3d0;
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 3px 3px 0 #c7b9a288;
    }
    .github-icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Series Segmented Navigation */
    .series-nav-wrapper {
      max-width: 1240px;
      margin: auto;
      padding: 18px 28px 0;
    }
    .series-nav {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }
    .series-nav::-webkit-scrollbar { display: none; }
    .series-tab {
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 9px 16px;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: var(--muted);
      font-family: inherit;
      transition: all .15s ease;
      white-space: nowrap;
      box-shadow: 2px 2px 0 #c7b9a233;
    }
    .series-tab:hover {
      color: var(--ink);
      background: #fff8ee;
      border-color: #bfae95;
    }
    .series-tab.active {
      background: #ede0cb;
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
      box-shadow: inset 1px 1px 0 #8d4d3922, 2px 2px 0 #8d4d3933;
    }
    .tab-badge {
      font: 11px ui-monospace, monospace;
      padding: 2px 5px;
      background: #ddd1bd;
      border-radius: 2px;
      color: var(--ink);
    }
    .series-tab.active .tab-badge {
      background: var(--accent);
      color: #fff;
    }
    .tab-title { font-size: 15px; }
    .tab-sub {
      font: 11px ui-monospace, monospace;
      opacity: .75;
      text-transform: uppercase;
    }

    /* Toolbar */
    .toolbar {
      max-width: 1240px;
      margin: auto;
      padding: 18px 28px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }
    input, select {
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 10px 13px;
      color: var(--ink);
      font: 13px ui-monospace, monospace;
      outline: none;
      transition: border-color .15s ease;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    input { min-width: 250px; }
    .count {
      margin-left: auto;
      color: var(--muted);
      font: 12px ui-monospace, monospace;
    }

    /* Grid & Cards */
    .grid {
      max-width: 1240px;
      margin: auto;
      padding: 32px 28px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 28px;
    }
    .card {
      cursor: pointer;
      transition: transform .18s ease;
    }
    .card:hover {
      transform: translateY(-3px);
    }
    .frame {
      position: relative;
      aspect-ratio: 4/5;
      background: var(--card-bg);
      border: 1px solid #c7b9a2;
      box-shadow: 4px 5px 0 #c7b9a244;
      overflow: hidden;
      transition: box-shadow .18s ease;
    }
    .card:hover .frame {
      box-shadow: 5px 7px 0 #c7b9a277;
    }
    .frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform .25s ease;
    }
    .card:hover .frame img {
      transform: scale(1.02);
    }
    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #eee5d5ee;
      border: 1px solid var(--line);
      padding: 4px 7px;
      font: 11px ui-monospace, monospace;
      letter-spacing: .04em;
    }
    .card h2 {
      font-size: 19px;
      font-weight: 500;
      margin: 12px 0 5px;
      line-height: 1.25;
    }
    .meta {
      font: 11px/1.5 ui-monospace, monospace;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .keywords {
      margin-top: 6px;
      color: var(--accent);
      font-size: 12px;
      line-height: 1.4;
    }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 70px 20px;
      font-size: 16px;
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      background: #211f1bdd;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      z-index: 50;
      backdrop-filter: blur(4px);
    }
    .lightbox.open { display: flex; }
    .modal {
      max-width: 920px;
      width: 100%;
      max-height: 94vh;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(240px, .75fr);
      background: var(--paper);
      padding: 16px;
      gap: 24px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 40px rgba(0,0,0,.35);
      position: relative;
    }
    .modal-img-wrap {
      position: relative;
      background: var(--card-bg);
      border: 1px solid #c7b9a2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .modal img {
      width: 100%;
      height: 100%;
      max-height: 84vh;
      object-fit: contain;
      display: block;
    }
    .modal aside {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
    }
    .modal-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal h2 {
      font-size: 32px;
      font-weight: 400;
      margin: 0 0 14px;
      line-height: 1.15;
    }
    .close {
      border: 0;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
      padding: 0 4px;
    }
    .close:hover { color: var(--accent); }
    .modal-meta {
      font: 12px/1.6 ui-monospace, monospace;
      color: var(--muted);
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }
    .modal-keywords {
      color: var(--accent);
      font-size: 14px;
      margin-bottom: 12px;
    }
    .modal-colors {
      font: 11px ui-monospace, monospace;
      color: var(--muted);
      margin-top: auto;
      padding-top: 12px;
    }
    .source {
      border-top: 1px solid var(--line);
      margin-top: 16px;
      padding-top: 12px;
      font: 11px/1.6 ui-monospace, monospace;
      color: var(--muted);
    }
    .modal-nav-btns {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .modal-btn {
      background: #f7f0e4;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 6px 12px;
      font: 12px ui-monospace, monospace;
      cursor: pointer;
      color: var(--ink);
    }
    .modal-btn:hover {
      background: #eee0cc;
      border-color: var(--accent);
      color: var(--accent);
    }

    @media(max-width: 760px) {
      header { padding: 36px 18px 20px; }
      .header-inner { flex-direction: column-reverse; gap: 16px; }
      .github-link { align-self: flex-start; }
      .series-nav-wrapper { padding-left: 18px; padding-right: 18px; }
      .toolbar, .grid { padding-left: 18px; padding-right: 18px; }
      .count { width: 100%; margin-left: 0; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .card h2 { font-size: 16px; }
      .modal { grid-template-columns: 1fr; max-height: 94vh; overflow-y: auto; gap: 14px; }
      .modal img { max-height: 52vh; }
      .modal aside { padding: 4px 6px; }
      .modal h2 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-content">
        <div class="kicker" id="hero-kicker">field notes / rubber stamp travel posters / 2026</div>
        <h1 id="hero-title">橡胶戳旅行实地笔记<br>世界城市</h1>
        <p id="hero-desc">30 座城市，30 枚低调的多色橡胶戳。每一张只留下一个地点最易辨认的轮廓：建筑、山脉、海岸线与城市的呼吸。</p>
      </div>
      <a href="https://github.com/holynova/rubber-stamp-world-cities" target="_blank" rel="noopener noreferrer" class="github-link" title="GitHub 源码仓库">
        <svg class="github-icon" viewBox="0 0 24 24">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>GitHub</span>
      </a>
    </div>
  </header>

  <!-- Collection Switcher Tabs -->
  <div class="series-nav-wrapper">
    <nav class="series-nav" id="series-nav">
      <button class="series-tab active" data-series="cities">
        <span class="tab-badge">30</span>
        <span class="tab-title">世界城市</span>
        <span class="tab-sub">Cities</span>
      </button>
      <button class="series-tab" data-series="zodiac">
        <span class="tab-badge">12</span>
        <span class="tab-title">十二生肖</span>
        <span class="tab-sub">Zodiac</span>
      </button>
      <button class="series-tab" data-series="solar_terms">
        <span class="tab-badge">24</span>
        <span class="tab-title">二十四节气</span>
        <span class="tab-sub">Solar Terms</span>
      </button>
    </nav>
  </div>

  <div class="toolbar">
    <input id="search" placeholder="搜索名称、特征或关键词…">
    <select id="filter">
      <!-- Populated dynamically based on series -->
    </select>
    <span class="count" id="count"></span>
  </div>

  <main class="grid" id="grid"></main>

  <div class="lightbox" id="lightbox">
    <div class="modal">
      <div class="modal-img-wrap">
        <img id="big" alt="">
      </div>
      <aside>
        <div class="modal-top-bar">
          <div class="kicker" id="number"></div>
          <button class="close" id="close" title="关闭 (Esc)">×</button>
        </div>
        <h2 id="title"></h2>
        <div class="modal-meta" id="details"></div>
        <div class="modal-keywords" id="desc"></div>
        <div class="modal-colors" id="colors-info"></div>
        <div class="source">海报规格：4:5 纵向 · 温暖旧米白纸张 · 手工雕刻橡胶戳 · 2026</div>
        <div class="modal-nav-btns">
          <button class="modal-btn" id="btn-prev">← 上一张</button>
          <button class="modal-btn" id="btn-next">下一张 →</button>
        </div>
      </aside>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    let currentSeriesKey = 'cities';
    let currentModalIndex = 0;
    let currentFilteredRows = [];
    const existsMap = new Map(); // seriesKey -> Set of item ids

    const grid = document.querySelector('#grid');
    const search = document.querySelector('#search');
    const filter = document.querySelector('#filter');
    const count = document.querySelector('#count');
    const heroKicker = document.querySelector('#hero-kicker');
    const heroTitle = document.querySelector('#hero-title');
    const heroDesc = document.querySelector('#hero-desc');
    const tabs = document.querySelectorAll('.series-tab');

    function getCollection() {
      return window.COLLECTIONS[currentSeriesKey];
    }

    function initFilterOptions() {
      if (currentSeriesKey === 'solar_terms') {
        filter.innerHTML = `
          <option value="all">全部节气 (24)</option>
          <option value="season-春">春季物候 (6)</option>
          <option value="season-夏">夏季物候 (6)</option>
          <option value="season-秋">秋季物候 (6)</option>
          <option value="season-冬">冬季物候 (6)</option>
        `;
      } else if (currentSeriesKey === 'zodiac') {
        filter.innerHTML = `
          <option value="all">全部生肖 (12)</option>
        `;
      } else {
        filter.innerHTML = `
          <option value="all">全部城市 (30)</option>
        `;
      }
    }

    function updateHeader() {
      const col = getCollection();
      heroKicker.textContent = col.kicker;
      heroTitle.innerHTML = col.headline;
      heroDesc.textContent = col.desc;
      document.title = `${col.title} · 橡胶戳艺术印记`;
    }

    function render() {
      const col = getCollection();
      const q = search.value.trim().toLowerCase();
      const f = filter.value;

      currentFilteredRows = col.items.filter(x => {
        const titleStr = (x.city || x.title || x.name || '') + ' ' + (x.animal || '') + ' ' + (x.season || '');
        const textToMatch = (titleStr + ' ' + (x.features || '') + ' ' + (x.keywords || []).join(' ')).toLowerCase();
        const matchesQuery = !q || textToMatch.includes(q);
        
        let matchesFilter = true;
        if (f && f.startsWith('season-')) matchesFilter = (x.season === f.replace('season-', ''));

        return matchesQuery && matchesFilter;
      });

      count.textContent = `${currentFilteredRows.length} / ${col.items.length} ${col.title} · 全部已就绪`;

      if (!currentFilteredRows.length) {
        grid.innerHTML = '<div class="empty">没有找到匹配的橡胶戳印记。</div>';
        return;
      }

      grid.innerHTML = currentFilteredRows.map((x, idx) => {
        const displayName = x.city || x.title || x.name;
        const badgeLabel = col.badgeFormat ? col.badgeFormat.replace('{id}', String(x.id).padStart(2, '0')) : `NO. ${String(x.id).padStart(2, '0')}`;
        return `
          <article class="card" data-id="${x.id}" data-index="${idx}">
            <div class="frame">
              <img src="${x.output}" alt="${displayName} 橡胶戳海报" onerror="this.src='placeholder.svg'">
              <span class="badge">${badgeLabel}</span>
            </div>
            <h2>${displayName}</h2>
            <div class="meta">${x.features || ''}</div>
            <div class="keywords">${(x.keywords || []).join(' · ')}</div>
          </article>
        `;
      }).join('');
    }

    function switchSeries(key) {
      if (currentSeriesKey === key) return;
      currentSeriesKey = key;
      tabs.forEach(t => t.classList.toggle('active', t.dataset.series === key));
      window.location.hash = key;
      updateHeader();
      initFilterOptions();
      search.value = '';
      render();
    }

    tabs.forEach(t => {
      t.addEventListener('click', () => switchSeries(t.dataset.series));
    });

    // Hash routing
    const hash = window.location.hash.replace('#', '');
    if (hash && window.COLLECTIONS[hash]) {
      switchSeries(hash);
    } else {
      updateHeader();
      initFilterOptions();
      render();
    }

    search.oninput = render;
    filter.onchange = render;

    // Lightbox modal logic
    function openModal(index) {
      if (index < 0 || index >= currentFilteredRows.length) return;
      currentModalIndex = index;
      const x = currentFilteredRows[index];
      const col = getCollection();
      const displayName = x.city || x.title || x.name;

      document.querySelector('#big').src = x.output;
      document.querySelector('#big').alt = displayName;
      document.querySelector('#number').textContent = `${col.titleEn.toUpperCase()} ${String(x.id).padStart(2, '0')} / ${col.items.length}`;
      document.querySelector('#title').textContent = displayName;
      document.querySelector('#details').textContent = x.features || '';
      document.querySelector('#desc').textContent = (x.keywords || []).join(' · ');
      document.querySelector('#colors-info').textContent = x.colors ? `印层配色：${x.colors}` : '';
      document.querySelector('#lightbox').classList.add('open');
    }

    grid.onclick = e => {
      const c = e.target.closest('.card');
      if (!c) return;
      const idx = parseInt(c.dataset.index, 10);
      openModal(idx);
    };

    document.querySelector('#close').onclick = () => document.querySelector('#lightbox').classList.remove('open');
    document.querySelector('#lightbox').onclick = e => {
      if (e.target.id === 'lightbox') e.currentTarget.classList.remove('open');
    };

    document.querySelector('#btn-prev').onclick = () => {
      if (currentModalIndex > 0) openModal(currentModalIndex - 1);
      else openModal(currentFilteredRows.length - 1);
    };

    document.querySelector('#btn-next').onclick = () => {
      if (currentModalIndex < currentFilteredRows.length - 1) openModal(currentModalIndex + 1);
      else openModal(0);
    };

    window.addEventListener('keydown', e => {
      const lb = document.querySelector('#lightbox');
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') lb.classList.remove('open');
      if (e.key === 'ArrowLeft') document.querySelector('#btn-prev').click();
      if (e.key === 'ArrowRight') document.querySelector('#btn-next').click();
    });
  </script>
</body>
</html>
